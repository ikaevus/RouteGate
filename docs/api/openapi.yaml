openapi: 3.0.3
info:
  title: RouteGate Manager API
  version: 0.1.0
  description: Foundation OpenAPI seed for RouteGate Manager and Agent APIs.

servers:
  - url: http://localhost:8080
    description: Local Manager API
  - url: http://localhost:5173
    description: Vite dev proxy

tags:
  - name: Health
  - name: Auth
  - name: Servers
  - name: Agents
  - name: Users
  - name: Roles

paths:
  /api/admin/health:
    get:
      tags: [Health]
      summary: Get Manager health
      responses:
        "200":
          description: Manager health response
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthResponse"

  /api/agent/health:
    get:
      tags: [Health]
      summary: Get Agent API health
      responses:
        "200":
          description: Agent API health response
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthResponse"

  /api/admin/auth/login:
    post:
      tags: [Auth]
      summary: Login with email or username
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/LoginRequest"
      responses:
        "200":
          description: Login accepted
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LoginResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"

  /api/v1/auth/login:
    post:
      tags: [Auth]
      summary: Login with email or username
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/LoginRequest"
      responses:
        "200":
          description: Login accepted
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LoginResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"

  /api/admin/auth/logout:
    post:
      tags: [Auth]
      summary: Revoke current session
      security:
        - bearerAuth: []
      responses:
        "200":
          description: Logout accepted
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/StatusResponse"

  /api/v1/auth/logout:
    post:
      tags: [Auth]
      summary: Revoke current session
      security:
        - bearerAuth: []
      responses:
        "200":
          description: Logout accepted
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/StatusResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"

  /api/admin/me:
    get:
      tags: [Auth]
      summary: Get current admin user
      security:
        - bearerAuth: []
      responses:
        "200":
          description: Current user
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MeResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"

  /api/v1/auth/me:
    get:
      tags: [Auth]
      summary: Get current authenticated user
      security:
        - bearerAuth: []
      responses:
        "200":
          description: Current user
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MeResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"

  /api/admin/servers:
    get:
      tags: [Servers]
      summary: List registered servers for legacy frontend compatibility
      responses:
        "200":
          description: Server list
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ListServersResponse"
        "500":
          $ref: "#/components/responses/InternalServerError"

    post:
      tags: [Servers]
      summary: Create server for legacy frontend compatibility
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateServerRequest"
      responses:
        "201":
          description: Server created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Server"
        "400":
          $ref: "#/components/responses/BadRequest"
        "500":
          $ref: "#/components/responses/InternalServerError"

  /api/admin/agents:
    get:
      tags: [Agents]
      summary: List registered agents for legacy frontend compatibility
      responses:
        "200":
          description: Agent list
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ListAgentsResponse"
        "500":
          $ref: "#/components/responses/InternalServerError"

  /api/v1/servers:
    get:
      tags: [Servers]
      summary: List registered servers
      security:
        - bearerAuth: []
      responses:
        "200":
          description: Server list
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ListServersResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"
    post:
      tags: [Servers]
      summary: Create server
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateServerRequest"
      responses:
        "201":
          description: Server created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Server"
        "401":
          $ref: "#/components/responses/Unauthorized"

  /api/v1/agents:
    get:
      tags: [Agents]
      summary: List registered agents
      security:
        - bearerAuth: []
      responses:
        "200":
          description: Agent list
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ListAgentsResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"

  /api/v1/users:
    get:
      tags: [Users]
      summary: List Manager users
      security:
        - bearerAuth: []
      responses:
        "200":
          description: User list
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ListUsersResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"
    post:
      tags: [Users]
      summary: Create Manager, portal, or agent user identity
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateUserRequest"
      responses:
        "201":
          description: User created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/User"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"

  /api/v1/users/{id}:
    get:
      tags: [Users]
      summary: Get user
      security:
        - bearerAuth: []
      parameters:
        - in: path
          name: id
          required: true
          schema: { type: string, format: uuid }
      responses:
        "200":
          description: User
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/User"
    patch:
      tags: [Users]
      summary: Update user
      security:
        - bearerAuth: []
      parameters:
        - in: path
          name: id
          required: true
          schema: { type: string, format: uuid }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateUserRequest"
      responses:
        "200":
          description: Updated user
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/User"

  /api/v1/users/{id}/disable:
    post:
      tags: [Users]
      summary: Disable user
      security:
        - bearerAuth: []
      parameters:
        - in: path
          name: id
          required: true
          schema: { type: string, format: uuid }
      responses:
        "200":
          description: Disabled user
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/User"

  /api/v1/users/{id}/enable:
    post:
      tags: [Users]
      summary: Enable user
      security:
        - bearerAuth: []
      parameters:
        - in: path
          name: id
          required: true
          schema: { type: string, format: uuid }
      responses:
        "200":
          description: Enabled user
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/User"

  /api/v1/roles:
    get:
      tags: [Roles]
      summary: List roles
      security:
        - bearerAuth: []
      responses:
        "200":
          description: Role list
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ListRolesResponse"

  /api/v1/permissions:
    get:
      tags: [Roles]
      summary: List permissions
      security:
        - bearerAuth: []
      responses:
        "200":
          description: Permission list
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ListPermissionsResponse"

  /api/agent/register:
    post:
      tags: [Agents]
      summary: Register development agent
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RegisterAgentRequest"
      responses:
        "201":
          description: Agent registered
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RegisterAgentResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "500":
          $ref: "#/components/responses/InternalServerError"

  /api/agent/heartbeat:
    post:
      tags: [Agents]
      summary: Send agent heartbeat
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/HeartbeatRequest"
      responses:
        "200":
          description: Heartbeat accepted
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HeartbeatResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "404":
          $ref: "#/components/responses/NotFound"
        "500":
          $ref: "#/components/responses/InternalServerError"

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer

  responses:
    BadRequest:
      description: Invalid request
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"

    Unauthorized:
      description: Authentication is required
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"

    NotFound:
      description: Entity was not found
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"

    InternalServerError:
      description: Internal server error
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"

  schemas:
    HealthResponse:
      type: object
      required: [status, service, timestamp]
      properties:
        status:
          type: string
          example: ok
        service:
          type: string
          example: routegate-manager
        timestamp:
          type: string
          format: date-time

    StatusResponse:
      type: object
      required: [status, timestamp]
      properties:
        status:
          type: string
          example: ok
        timestamp:
          type: string
          format: date-time

    ErrorResponse:
      type: object
      required: [status, message]
      properties:
        status:
          type: string
          example: invalid_request
        message:
          type: string
          example: Request body must be valid JSON.

    AuthUser:
      type: object
      required: [id, email, user_type, status, roles, permissions]
      properties:
        id:
          type: string
          format: uuid
        email:
          type: string
          example: admin@routegate.local
        username:
          type: string
          example: admin
        display_name:
          type: string
          example: RouteGate Admin
        user_type:
          type: string
          enum: [human, vpn_user, agent]
        status:
          type: string
          enum: [active, disabled, locked, pending]
        roles:
          type: array
          items:
            type: string
          example: [super_admin]
        permissions:
          type: array
          items:
            type: string
          example: [users:read]

    LoginRequest:
      type: object
      required: [login, password]
      properties:
        login:
          type: string
          example: admin@routegate.local
        email:
          type: string
          description: Legacy compatibility alias for login.
          example: admin@routegate.local
        password:
          type: string
          example: admin

    LoginResponse:
      type: object
      required: [token, expires_at, user]
      properties:
        token:
          type: string
          example: opaque-token-returned-once
        expires_at:
          type: string
          format: date-time
        user:
          $ref: "#/components/schemas/AuthUser"

    MeResponse:
      type: object
      required: [user]
      properties:
        user:
          $ref: "#/components/schemas/AuthUser"


    User:
      allOf:
        - $ref: "#/components/schemas/AuthUser"

    CreateUserRequest:
      type: object
      required: [email, password]
      properties:
        email:
          type: string
        username:
          type: string
        password:
          type: string
        display_name:
          type: string
        user_type:
          type: string
          enum: [human, vpn_user, agent]
        status:
          type: string
          enum: [active, disabled, locked, pending]
        roles:
          type: array
          items:
            type: string

    ListUsersResponse:
      type: object
      required: [items]
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/User"

    Role:
      type: object
      properties:
        id: { type: string, format: uuid }
        code: { type: string }
        name: { type: string }
        description: { type: string }
        built_in: { type: boolean }
        permissions:
          type: array
          items: { type: string }

    Permission:
      type: object
      properties:
        id: { type: string, format: uuid }
        code: { type: string }
        name: { type: string }
        description: { type: string }

    ListRolesResponse:
      type: object
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/Role"

    ListPermissionsResponse:
      type: object
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/Permission"

    Server:
      type: object
      required: [id, name, hostname, publicIp, location, provider, status, createdAt]
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
          example: Demo Finland VPS
        hostname:
          type: string
          example: fi-demo.routegate.local
        publicIp:
          type: string
          example: 203.0.113.10
        location:
          type: string
          example: Finland
        provider:
          type: string
          example: Demo
        status:
          type: string
          example: online
        createdAt:
          type: string
          format: date-time

    CreateServerRequest:
      type: object
      required: [name]
      properties:
        name:
          type: string
          example: My VPS
        hostname:
          type: string
          example: vps.example.local
        publicIp:
          type: string
          example: 203.0.113.20
        location:
          type: string
          example: Finland
        provider:
          type: string
          example: Hostkey

    ListServersResponse:
      type: object
      required: [items]
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/Server"

    Agent:
      type: object
      required: [id, serverId, name, version, hostname, status, lastSeen, createdAt]
      properties:
        id:
          type: string
          format: uuid
        serverId:
          type: string
          nullable: true
        name:
          type: string
          example: Demo Agent
        version:
          type: string
          example: 0.1.0
        hostname:
          type: string
          example: fi-demo-routegate
        status:
          type: string
          example: online
        lastSeen:
          type: string
          format: date-time
        createdAt:
          type: string
          format: date-time

    ListAgentsResponse:
      type: object
      required: [items]
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/Agent"

    RegisterAgentRequest:
      type: object
      required: [name]
      properties:
        serverId:
          type: string
          example: srv-dev-001
        name:
          type: string
          example: Local Test Agent
        version:
          type: string
          example: 0.1.0
        hostname:
          type: string
          example: codespace-agent

    RegisterAgentResponse:
      type: object
      required: [agent, token]
      properties:
        agent:
          $ref: "#/components/schemas/Agent"
        token:
          type: string
          example: routegate-agent-dev-token

    HeartbeatRequest:
      type: object
      required: [agentId]
      properties:
        agentId:
          type: string
          format: uuid
        version:
          type: string
          example: 0.1.0
        hostname:
          type: string
          example: codespace-agent
        status:
          type: string
          example: online

    HeartbeatResponse:
      type: object
      required: [status, timestamp]
      properties:
        status:
          type: string
          example: ok
        timestamp:
          type: string
          format: date-time