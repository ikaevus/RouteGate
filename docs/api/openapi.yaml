openapi: 3.0.3
info:
  title: RouteGate Manager API
  version: 0.1.0
  description: Foundation OpenAPI seed for RouteGate Manager and Agent APIs.

servers:
  - url: http://localhost:8080
    description: Local Manager API
  - url: http://localhost:5173
    description: Vite dev proxy

tags:
  - name: Health
  - name: Auth
  - name: Servers
  - name: Agents
  - name: Users
  - name: Roles
  - name: Node Groups
  - name: VPN Accounts
  - name: Updates

paths:
  /api/admin/health:
    get:
      tags: [Health]
      summary: Get Manager health
      responses:
        "200":
          description: Manager health response
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthResponse"

  /api/admin/auth/login:
    post:
      tags: [Auth]
      summary: Login with email or username
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/LoginRequest"
      responses:
        "200":
          description: Login accepted
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LoginResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"

  /api/v1/auth/login:
    post:
      tags: [Auth]
      summary: Login with email or username
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/LoginRequest"
      responses:
        "200":
          description: Login accepted
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LoginResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"

  /api/admin/auth/logout:
    post:
      tags: [Auth]
      summary: Revoke current session
      security:
        - bearerAuth: []
      responses:
        "200":
          description: Logout accepted
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/StatusResponse"

  /api/v1/auth/logout:
    post:
      tags: [Auth]
      summary: Revoke current session
      security:
        - bearerAuth: []
      responses:
        "200":
          description: Logout accepted
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/StatusResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"

  /api/admin/me:
    get:
      tags: [Auth]
      summary: Get current admin user
      security:
        - bearerAuth: []
      responses:
        "200":
          description: Current user
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MeResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"

  /api/v1/auth/me:
    get:
      tags: [Auth]
      summary: Get current authenticated user
      security:
        - bearerAuth: []
      responses:
        "200":
          description: Current user
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MeResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"

  /api/admin/servers:
    get:
      tags: [Servers]
      summary: List registered servers for legacy frontend compatibility
      responses:
        "200":
          description: Server list
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ListServersResponse"
        "500":
          $ref: "#/components/responses/InternalServerError"

    post:
      tags: [Servers]
      summary: Create server for legacy frontend compatibility
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateServerRequest"
      responses:
        "201":
          description: Server created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Server"
        "400":
          $ref: "#/components/responses/BadRequest"
        "500":
          $ref: "#/components/responses/InternalServerError"

  /api/v1/servers:
    get:
      tags: [Servers]
      summary: List registered servers
      security:
        - bearerAuth: []
      responses:
        "200":
          description: Server list
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ListServersResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"
    post:
      tags: [Servers]
      summary: Create server
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateServerRequest"
      responses:
        "201":
          description: Server created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Server"
        "401":
          $ref: "#/components/responses/Unauthorized"

  /api/v1/servers/{server_id}/registration-token:
    post:
      tags: [Servers, Agents]
      summary: Create one-time Agent bootstrap material for a VPN or Hybrid Node
      security:
        - bearerAuth: []
      parameters:
        - in: path
          name: server_id
          required: true
          schema:
            type: string
            format: uuid
      responses:
        "201":
          description: Registration token and optional one-command Agent bootstrap instruction
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RegistrationTokenResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "409":
          description: The selected node role does not host Agent or VPN Core
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /api/v1/agents:
    get:
      tags: [Agents]
      summary: List registered agents
      security:
        - bearerAuth: []
      responses:
        "200":
          description: Agent list
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ListAgentsResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"

  /api/v1/agent/register:
    post:
      tags: [Agents]
      summary: Register an Agent with a server registration token
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AgentRegistrationRequest"
      responses:
        "201":
          description: Agent registered and persistent Agent credential issued
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AgentRegistrationResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "500":
          $ref: "#/components/responses/InternalServerError"

  /api/v1/agent/heartbeat:
    post:
      tags: [Agents]
      summary: Report Agent heartbeat and compatibility metadata
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AgentHeartbeatRequest"
      responses:
        "200":
          description: Heartbeat accepted
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AgentHeartbeatResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "500":
          $ref: "#/components/responses/InternalServerError"

  /api/v1/system/version:
    get:
      tags: [System]
      summary: Read Manager and compatibility version metadata
      security:
        - bearerAuth: []
      responses:
        "200":
          description: System version metadata
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SystemVersionResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"

  /api/v1/users:
    get:
      tags: [Users]
      summary: List Manager users
      security:
        - bearerAuth: []
      responses:
        "200":
          description: User list
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ListUsersResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"
    post:
      tags: [Users]
      summary: Create Manager, portal, or agent user identity
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateUserRequest"
      responses:
        "201":
          description: User created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/User"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"

  /api/v1/users/{id}:
    get:
      tags: [Users]
      summary: Get user
      security:
        - bearerAuth: []
      parameters:
        - in: path
          name: id
          required: true
          schema: { type: string, format: uuid }
      responses:
        "200":
          description: User
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/User"
    patch:
      tags: [Users]
      summary: Update user
      security:
        - bearerAuth: []
      parameters:
        - in: path
          name: id
          required: true
          schema: { type: string, format: uuid }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateUserRequest"
      responses:
        "200":
          description: Updated user
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/User"

  /api/v1/users/{id}/disable:
    post:
      tags: [Users]
      summary: Disable user
      security:
        - bearerAuth: []
      parameters:
        - in: path
          name: id
          required: true
          schema: { type: string, format: uuid }
      responses:
        "200":
          description: Disabled user
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/User"

  /api/v1/users/{id}/enable:
    post:
      tags: [Users]
      summary: Enable user
      security:
        - bearerAuth: []
      parameters:
        - in: path
          name: id
          required: true
          schema: { type: string, format: uuid }
      responses:
        "200":
          description: Enabled user
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/User"

  /api/v1/roles:
    get:
      tags: [Roles]
      summary: List roles
      security:
        - bearerAuth: []
      responses:
        "200":
          description: Role list
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ListRolesResponse"

  /api/v1/permissions:
    get:
      tags: [Roles]
      summary: List permissions
      security:
        - bearerAuth: []
      responses:
        "200":
          description: Permission list
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ListPermissionsResponse"

  /api/v1/node-groups:
    get:
      tags: [Node Groups]
      summary: List node groups
      security: [{ bearerAuth: [] }]
      responses:
        "200":
          description: Node group list
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items:
                    type: array
                    items: { $ref: "#/components/schemas/NodeGroup" }
    post:
      tags: [Node Groups]
      summary: Create node group
      security: [{ bearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/CreateNodeGroupRequest" }
      responses:
        "201":
          description: Node group created
          content:
            application/json:
              schema: { $ref: "#/components/schemas/NodeGroup" }

  /api/v1/node-groups/{group_id}:
    get:
      tags: [Node Groups]
      summary: Get node group with members
      security: [{ bearerAuth: [] }]
      parameters:
        - in: path
          name: group_id
          required: true
          schema: { type: string, format: uuid }
      responses:
        "200":
          description: Node group
          content:
            application/json:
              schema: { $ref: "#/components/schemas/NodeGroup" }
    patch:
      tags: [Node Groups]
      summary: Update node group policy
      security: [{ bearerAuth: [] }]
      parameters:
        - in: path
          name: group_id
          required: true
          schema: { type: string, format: uuid }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/UpdateNodeGroupRequest" }
      responses:
        "200":
          description: Updated node group
          content:
            application/json:
              schema: { $ref: "#/components/schemas/NodeGroup" }
    delete:
      tags: [Node Groups]
      summary: Delete an unassigned node group
      security: [{ bearerAuth: [] }]
      parameters:
        - in: path
          name: group_id
          required: true
          schema: { type: string, format: uuid }
      responses:
        "204": { description: Node group deleted }
        "409": { description: Node group is assigned to a VPN account }

  /api/v1/node-groups/{group_id}/members/{server_id}:
    put:
      tags: [Node Groups]
      summary: Add or update a VPN node group member
      security: [{ bearerAuth: [] }]
      parameters:
        - in: path
          name: group_id
          required: true
          schema: { type: string, format: uuid }
        - in: path
          name: server_id
          required: true
          schema: { type: string, format: uuid }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/UpsertNodeGroupMemberRequest" }
      responses:
        "200":
          description: Updated member
          content:
            application/json:
              schema: { $ref: "#/components/schemas/NodeGroupMember" }
    delete:
      tags: [Node Groups]
      summary: Remove a node group member
      security: [{ bearerAuth: [] }]
      parameters:
        - in: path
          name: group_id
          required: true
          schema: { type: string, format: uuid }
        - in: path
          name: server_id
          required: true
          schema: { type: string, format: uuid }
      responses:
        "204": { description: Member removed }

  /api/v1/node-groups/{group_id}/candidates:
    get:
      tags: [Node Groups]
      summary: Inspect read-only node-group candidate health
      security: [{ bearerAuth: [] }]
      parameters:
        - in: path
          name: group_id
          required: true
          schema: { type: string, format: uuid }
      responses:
        "200":
          description: Read-only candidate evidence consumed by automatic selection
          content:
            application/json:
              schema: { $ref: "#/components/schemas/NodeGroupCandidatesResponse" }

  /api/v1/vpn-accounts/{id}/routing-policy:
    get:
      tags: [VPN Accounts]
      summary: Get effective account routing and node-group policy
      security: [{ bearerAuth: [] }]
      parameters:
        - in: path
          name: id
          required: true
          schema: { type: string, format: uuid }
      responses:
        "200":
          description: Account routing policy
          content:
            application/json:
              schema: { $ref: "#/components/schemas/VPNAccountRoutingPolicy" }

  /api/v1/vpn-accounts/{id}/routing-profile:
    put:
      tags: [VPN Accounts]
      summary: Assign an account routing-profile override
      security: [{ bearerAuth: [] }]
      parameters:
        - in: path
          name: id
          required: true
          schema: { type: string, format: uuid }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [routingProfileId]
              properties:
                routingProfileId: { type: string, format: uuid }
      responses:
        "200":
          description: Updated account routing policy
          content:
            application/json:
              schema: { $ref: "#/components/schemas/VPNAccountRoutingPolicy" }
    delete:
      tags: [VPN Accounts]
      summary: Clear the account override and restore inheritance
      security: [{ bearerAuth: [] }]
      parameters:
        - in: path
          name: id
          required: true
          schema: { type: string, format: uuid }
      responses:
        "200":
          description: Inherited account routing policy
          content:
            application/json:
              schema: { $ref: "#/components/schemas/VPNAccountRoutingPolicy" }

  /api/v1/vpn-accounts/{id}/node-group:
    put:
      tags: [VPN Accounts]
      summary: Assign the node-group target without immediately moving the account
      security: [{ bearerAuth: [] }]
      parameters:
        - in: path
          name: id
          required: true
          schema: { type: string, format: uuid }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [nodeGroupId]
              properties:
                nodeGroupId: { type: string, format: uuid }
      responses:
        "200":
          description: Updated account routing policy
          content:
            application/json:
              schema: { $ref: "#/components/schemas/VPNAccountRoutingPolicy" }
    delete:
      tags: [VPN Accounts]
      summary: Clear the future node-group target
      security: [{ bearerAuth: [] }]
      parameters:
        - in: path
          name: id
          required: true
          schema: { type: string, format: uuid }
      responses:
        "200":
          description: Account routing policy without a node-group target
          content:
            application/json:
              schema: { $ref: "#/components/schemas/VPNAccountRoutingPolicy" }

  /api/v1/vpn-accounts/{id}/automatic-selection:
    put:
      tags: [VPN Accounts]
      summary: Configure explainable automatic node selection for an account
      security: [{ bearerAuth: [] }]
      parameters:
        - in: path
          name: id
          required: true
          schema: { type: string, format: uuid }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/UpdateAutomaticSelectionPolicyRequest" }
      responses:
        "200":
          description: Updated routing and automatic-selection policy
          content:
            application/json:
              schema: { $ref: "#/components/schemas/VPNAccountRoutingPolicy" }
        "409": { description: A node group is required before enabling selection }

  /api/v1/vpn-accounts/{id}/automatic-selection/preview:
    get:
      tags: [VPN Accounts]
      summary: Evaluate the current deterministic node-selection decision
      security: [{ bearerAuth: [] }]
      parameters:
        - in: path
          name: id
          required: true
          schema: { type: string, format: uuid }
      responses:
        "200":
          description: Explainable selection preview without assignment mutation
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AutomaticSelectionDecision" }

  /api/v1/vpn-accounts/{id}/automatic-selection/apply:
    post:
      tags: [VPN Accounts]
      summary: Re-evaluate and apply the selected VPN node
      description: Changes the concrete account server assignment only after a fresh evaluation. The response lists every VPN node whose configuration must be rendered and deployed next.
      security: [{ bearerAuth: [] }]
      parameters:
        - in: path
          name: id
          required: true
          schema: { type: string, format: uuid }
      responses:
        "200":
          description: Applied or already-current selection decision
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AutomaticSelectionApplyResponse" }
        "409": { description: Selection is disabled, blocked by cooldown, or has no eligible target }

  /api/v1/platform-update-rollouts:
    post:
      tags: [Updates]
      summary: Create an immutable ordered VPN-node update rollout
      description: Requires system:manage. Creation records a rollout snapshot only and does not admit a host mutation.
      security: [{ bearerAuth: [] }]
      parameters:
        - in: header
          name: Idempotency-Key
          required: true
          description: Canonical UUIDv4 used only to make rollout snapshot creation replay-safe.
          schema:
            type: string
            format: uuid
            pattern: '^[0-9a-f]{8}-[0-9a-f]{4}-4[0-9a-f]{3}-[89ab][0-9a-f]{3}-[0-9a-f]{12}$'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/CreatePlatformUpdateRolloutRequest" }
      responses:
        "201":
          description: New durable rollout snapshot
          content:
            application/json:
              schema: { $ref: "#/components/schemas/PlatformUpdateRolloutResponse" }
        "200":
          description: Identical replay of an existing rollout snapshot
          content:
            application/json:
              schema: { $ref: "#/components/schemas/PlatformUpdateRolloutResponse" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "409":
          description: The idempotency key is already bound to a different canonical request
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorResponse" }
        "500": { $ref: "#/components/responses/InternalServerError" }

  /api/v1/platform-update-rollouts/{rollout_id}:
    get:
      tags: [Updates]
      summary: Read bounded durable rollout state
      description: Requires servers:read. Metadata and ordered entries come from one coherent Manager database snapshot.
      security: [{ bearerAuth: [] }]
      parameters:
        - $ref: "#/components/parameters/PlatformUpdateRolloutId"
      responses:
        "200":
          description: Manager-owned rollout state
          content:
            application/json:
              schema: { $ref: "#/components/schemas/PlatformUpdateRolloutResponse" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "500": { $ref: "#/components/responses/InternalServerError" }

  /api/v1/platform-update-rollouts/{rollout_id}/advance:
    post:
      tags: [Updates]
      summary: Advance a rollout by at most one durable step
      description: Requires system:manage. The request body must be empty; one request invokes the bounded rollout controller exactly once.
      security: [{ bearerAuth: [] }]
      parameters:
        - $ref: "#/components/parameters/PlatformUpdateRolloutId"
      responses:
        "200":
          description: Bounded result of the single explicit advancement
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AdvancePlatformUpdateRolloutResponse" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "500": { $ref: "#/components/responses/InternalServerError" }
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer

  responses:
    BadRequest:
      description: Invalid request
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"

    Unauthorized:
      description: Authentication is required
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"

    Forbidden:
      description: Required permission is missing
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"

    NotFound:
      description: Entity was not found
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"

    InternalServerError:
      description: Internal server error
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"

  parameters:
    PlatformUpdateRolloutId:
      in: path
      name: rollout_id
      required: true
      schema:
        type: string
        format: uuid

  schemas:
    HealthResponse:
      type: object
      required: [status, service, timestamp]
      properties:
        status:
          type: string
          example: ok
        service:
          type: string
          example: routegate-manager
        timestamp:
          type: string
          format: date-time

    StatusResponse:
      type: object
      required: [status, timestamp]
      properties:
        status:
          type: string
          example: ok
        timestamp:
          type: string
          format: date-time

    ErrorResponse:
      type: object
      required: [status, message]
      properties:
        status:
          type: string
          example: invalid_request
        message:
          type: string
          example: Request body must be valid JSON.

    AuthUser:
      type: object
      required: [id, email, user_type, status, roles, permissions]
      properties:
        id:
          type: string
          format: uuid
        email:
          type: string
          example: admin@routegate.local
        username:
          type: string
          example: admin
        display_name:
          type: string
          example: RouteGate Admin
        user_type:
          type: string
          enum: [human, vpn_user, agent]
        status:
          type: string
          enum: [active, disabled, locked, pending]
        roles:
          type: array
          items:
            type: string
          example: [super_admin]
        permissions:
          type: array
          items:
            type: string
          example: [users:read]

    LoginRequest:
      type: object
      required: [login, password]
      properties:
        login:
          type: string
          example: admin@routegate.local
        email:
          type: string
          description: Legacy compatibility alias for login.
          example: admin@routegate.local
        password:
          type: string
          example: admin

    LoginResponse:
      type: object
      required: [token, expires_at, user]
      properties:
        token:
          type: string
          example: opaque-token-returned-once
        expires_at:
          type: string
          format: date-time
        user:
          $ref: "#/components/schemas/AuthUser"

    MeResponse:
      type: object
      required: [user]
      properties:
        user:
          $ref: "#/components/schemas/AuthUser"

    User:
      allOf:
        - $ref: "#/components/schemas/AuthUser"

    CreateUserRequest:
      type: object
      required: [email, password]
      properties:
        email:
          type: string
        username:
          type: string
        password:
          type: string
        display_name:
          type: string
        user_type:
          type: string
          enum: [human, vpn_user, agent]
        status:
          type: string
          enum: [active, disabled, locked, pending]
        roles:
          type: array
          items:
            type: string

    ListUsersResponse:
      type: object
      required: [items]
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/User"

    Role:
      type: object
      properties:
        id: { type: string, format: uuid }
        code: { type: string }
        name: { type: string }
        description: { type: string }
        built_in: { type: boolean }
        permissions:
          type: array
          items: { type: string }

    Permission:
      type: object
      properties:
        id: { type: string, format: uuid }
        code: { type: string }
        name: { type: string }
        description: { type: string }

    ListRolesResponse:
      type: object
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/Role"

    ListPermissionsResponse:
      type: object
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/Permission"

    Server:
      type: object
      required: [id, name, deploymentRole, status, createdAt]
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
          example: Demo Finland VPS
        deploymentRole:
          type: string
          enum: [management, vpn, hybrid]
          example: hybrid
        hostname:
          type: string
          example: fi-demo.routegate.local
        publicIp:
          type: string
          example: 203.0.113.10
        location:
          type: string
          example: Finland
        provider:
          type: string
          example: Demo
        status:
          type: string
          example: online
        agent:
          allOf:
            - $ref: "#/components/schemas/Agent"
          nullable: true
        inventory:
          $ref: "#/components/schemas/NodeInventorySummary"
        createdAt:
          type: string
          format: date-time

    NodeInventorySummary:
      type: object
      required: [connectionState, capabilityStatus, nextAction, managedAdapterCount]
      properties:
        connectionState:
          type: string
          enum: [not_applicable, awaiting_agent, online, offline]
        capabilityStatus:
          type: string
          enum: [not_applicable, not_reported, compatible, incompatible]
        nextAction:
          type: string
          enum: [none, install_agent, restore_connection, review_compatibility, review_capabilities]
        capabilitySchemaVersion:
          type: integer
          example: 1
        managedAdapterCount:
          type: integer
          minimum: 0
          example: 1

    RegistrationTokenResponse:
      type: object
      required: [serverId, registrationToken, expiresAt]
      properties:
        serverId:
          type: string
          format: uuid
        registrationToken:
          type: string
          description: Raw one-time credential returned only by this request.
        expiresAt:
          type: string
          format: date-time
        managerUrl:
          type: string
          format: uri
          example: https://manager.routegate.example
        bootstrapCommand:
          type: string
          description: Copyable Agent-only installation command. Present when ROUTEGATE_PUBLIC_URL is a valid HTTPS origin.

    CreateServerRequest:
      type: object
      required: [name]
      properties:
        name:
          type: string
          example: My VPS
        deploymentRole:
          type: string
          enum: [management, vpn, hybrid]
          default: vpn
        hostname:
          type: string
          example: vps.example.local
        publicIp:
          type: string
          example: 203.0.113.20
        location:
          type: string
          example: Finland
        provider:
          type: string
          example: Hostkey

    ListServersResponse:
      type: object
      required: [items]
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/Server"

    Agent:
      type: object
      required: [id, serverId, agentVersion, version, status, compatibility, createdAt]
      properties:
        id:
          type: string
          format: uuid
        serverId:
          type: string
          nullable: true
        name:
          type: string
        version:
          type: string
          example: 0.1.0
        agentVersion:
          type: string
          example: 0.1.0
        protocolVersion:
          type: integer
          nullable: true
          example: 1
        compatibility:
          $ref: "#/components/schemas/AgentCompatibility"
        hostname:
          type: string
          example: vpn.example.com
        status:
          type: string
          example: online
        lastSeen:
          type: string
          format: date-time
        createdAt:
          type: string
          format: date-time

    ListAgentsResponse:
      type: object
      required: [items]
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/Agent"

    AgentCompatibility:
      type: object
      required: [status]
      properties:
        status:
          type: string
          enum: [compatible, upgrade_recommended, upgrade_required, unsupported, unknown]
        message:
          type: string

    AgentRegistrationRequest:
      type: object
      required: [registrationToken, hostname, agentVersion, os, arch, capabilities]
      properties:
        registrationToken:
          type: string
        hostname:
          type: string
          example: vpn.example.com
        agentVersion:
          type: string
          example: 0.1.0
        protocolVersion:
          type: integer
          nullable: true
          example: 1
        os:
          type: string
          example: linux
        arch:
          type: string
          example: amd64
        capabilities:
          type: object
          additionalProperties: true

    AgentRegistrationResponse:
      type: object
      required: [agentId, serverId, agentToken, agentTokenPreview]
      properties:
        agentId:
          type: string
          format: uuid
        serverId:
          type: string
          format: uuid
        agentToken:
          type: string
        agentTokenPreview:
          type: string

    AgentHeartbeatRequest:
      type: object
      properties:
        agentVersion:
          type: string
          example: 0.1.0
        protocolVersion:
          type: integer
          nullable: true
          example: 1
        capabilities:
          type: object
          additionalProperties: true

    AgentHeartbeatResponse:
      type: object
      required: [ok, agentId, serverId, serverStatus]
      properties:
        ok:
          type: boolean
        agentId:
          type: string
          format: uuid
        serverId:
          type: string
          format: uuid
        serverStatus:
          type: string
          example: active

    SystemVersionResponse:
      type: object
      properties:
        manager:
          type: object
          properties:
            version: { type: string, example: dev }
            gitCommit: { type: string, example: unknown }
            buildDate: { type: string, example: unknown }
        webUi:
          type: object
          properties:
            version: { type: string, example: dev }
        database:
          type: object
          properties:
            expectedSchemaVersion: { type: integer, example: 128 }
            appliedSchemaVersion: { type: string, example: "000128_node_groups_routing_extensions" }
        agentCompatibility:
          type: object
          properties:
            protocolVersion: { type: integer, example: 1 }
            minimumProtocolVersion: { type: integer, example: 1 }
            recommendedAgentVersion: { type: string, example: dev }
        update:
          type: object
          properties:
            status: { type: string, example: manual }
            channel: { type: string, example: development }
            automaticUpdatesSupported: { type: boolean, example: false }

    CreatePlatformUpdateRolloutRequest:
      type: object
      additionalProperties: false
      required: [targetVersion, serverIds]
      properties:
        targetVersion:
          type: string
          example: v1.2.3
        serverIds:
          type: array
          minItems: 1
          maxItems: 1024
          uniqueItems: true
          items: { type: string, format: uuid }

    PlatformUpdateRolloutResponse:
      type: object
      required: [rollout]
      properties:
        rollout: { $ref: "#/components/schemas/PlatformUpdateRollout" }

    PlatformUpdateRollout:
      type: object
      required: [id, targetVersion, status, createdAt, entries]
      properties:
        id: { type: string, format: uuid }
        targetVersion: { type: string, example: v1.2.3 }
        status: { type: string, enum: [pending, running, succeeded, failed, outcome_unknown] }
        createdAt: { type: string, format: date-time }
        startedAt: { type: string, format: date-time, nullable: true }
        completedAt: { type: string, format: date-time, nullable: true }
        errorCode: { type: string, description: Bounded durable Manager-owned terminal reason code. }
        entries:
          type: array
          maxItems: 1024
          items: { $ref: "#/components/schemas/PlatformUpdateRolloutEntry" }

    PlatformUpdateRolloutEntry:
      type: object
      required: [serverId, position, status, planningBlockers]
      properties:
        serverId: { type: string, format: uuid }
        position: { type: integer, minimum: 0 }
        status: { type: string, enum: [queued, waiting, updating, healthy, failed, outcome_unknown, skipped] }
        planningBlockers:
          type: array
          items: { type: string }
        jobId: { type: string, format: uuid }
        completedAt: { type: string, format: date-time, nullable: true }
        blockerCode: { type: string, description: Bounded durable Manager-owned entry blocker code. }

    AdvancePlatformUpdateRolloutResponse:
      type: object
      required: [rolloutId, rolloutStatus, action]
      properties:
        rolloutId: { type: string, format: uuid }
        rolloutStatus: { type: string, enum: [pending, running, succeeded, failed, outcome_unknown] }
        serverId: { type: string, format: uuid }
        jobId: { type: string, format: uuid }
        action:
          type: string
          enum: [mutation_admitted, mutation_in_progress, waiting_health, node_healthy, rollout_succeeded, rollout_failed, outcome_unknown, no_change]
        waitingReason: { type: string }
        errorCode: { type: string }
        blockerCode: { type: string }

    NodeGroup:
      type: object
      required: [id, name, selectionStrategy, memberCount, createdAt, updatedAt]
      properties:
        id: { type: string, format: uuid }
        name: { type: string }
        description: { type: string }
        selectionStrategy: { type: string, enum: [priority, weighted] }
        memberCount: { type: integer, minimum: 0 }
        members:
          type: array
          items: { $ref: "#/components/schemas/NodeGroupMember" }
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }

    CreateNodeGroupRequest:
      type: object
      required: [name, selectionStrategy]
      properties:
        name: { type: string, minLength: 1, maxLength: 120 }
        description: { type: string, maxLength: 500 }
        selectionStrategy: { type: string, enum: [priority, weighted] }

    UpdateNodeGroupRequest:
      type: object
      properties:
        name: { type: string, minLength: 1, maxLength: 120 }
        description: { type: string, maxLength: 500 }
        selectionStrategy: { type: string, enum: [priority, weighted] }

    NodeGroupMember:
      type: object
      required: [nodeGroupId, serverId, serverName, protocol, deploymentRole, priority, weight, enabled]
      properties:
        nodeGroupId: { type: string, format: uuid }
        serverId: { type: string, format: uuid }
        serverName: { type: string }
        protocol: { type: string, enum: [vless, wireguard, hysteria2, shadowsocks, mtproto] }
        deploymentRole: { type: string, enum: [vpn, hybrid] }
        priority: { type: integer, minimum: 0, maximum: 10000 }
        weight: { type: integer, minimum: 1, maximum: 1000 }
        enabled: { type: boolean }

    UpsertNodeGroupMemberRequest:
      type: object
      properties:
        priority: { type: integer, minimum: 0, maximum: 10000, default: 100 }
        weight: { type: integer, minimum: 1, maximum: 1000, default: 100 }
        enabled: { type: boolean, default: true }

    NodeGroupCandidate:
      type: object
      required: [serverId, serverName, protocol, priority, weight, memberEnabled, nodeStatus, protocolSupported, eligible, health, signals]
      properties:
        serverId: { type: string, format: uuid }
        serverName: { type: string }
        protocol: { type: string }
        priority: { type: integer }
        weight: { type: integer }
        memberEnabled: { type: boolean }
        nodeStatus: { type: string }
        agentStatus: { type: string }
        lastSeenAt: { type: string, format: date-time }
        load1: { type: number, format: double }
        logicalCpus: { type: integer }
        loadPerCpu: { type: number, format: double }
        protocolSupported: { type: boolean }
        runtimeState: { type: string }
        eligible: { type: boolean }
        health: { type: string, enum: [ready, degraded, unavailable] }
        signals:
          type: array
          items: { type: string }

    NodeGroupCandidatesResponse:
      type: object
      required: [nodeGroupId, selectionStrategy, candidates]
      properties:
        nodeGroupId: { type: string, format: uuid }
        selectionStrategy: { type: string, enum: [priority, weighted] }
        candidates:
          type: array
          items: { $ref: "#/components/schemas/NodeGroupCandidate" }

    RoutingProfilePolicySummary:
      type: object
      required: [id, name, isDefault]
      properties:
        id: { type: string, format: uuid }
        name: { type: string }
        description: { type: string }
        isDefault: { type: boolean }

    NodeGroupPolicySummary:
      type: object
      required: [id, name, selectionStrategy, memberCount]
      properties:
        id: { type: string, format: uuid }
        name: { type: string }
        selectionStrategy: { type: string, enum: [priority, weighted] }
        memberCount: { type: integer, minimum: 0 }

    VPNAccountRoutingPolicy:
      type: object
      required: [vpnAccountId, routingProfileSource, currentServerInGroup, automaticSelection, automaticSelectionPolicy, clientRoutingSupported]
      properties:
        vpnAccountId: { type: string, format: uuid }
        explicitRoutingProfile: { $ref: "#/components/schemas/RoutingProfilePolicySummary" }
        effectiveRoutingProfile: { $ref: "#/components/schemas/RoutingProfilePolicySummary" }
        routingProfileSource: { type: string, enum: [none, account, server, default] }
        nodeGroup: { $ref: "#/components/schemas/NodeGroupPolicySummary" }
        currentServerInGroup: { type: boolean }
        automaticSelection:
          type: boolean
        automaticSelectionPolicy: { $ref: "#/components/schemas/AutomaticSelectionPolicy" }
        protocol: { type: string }
        clientRoutingSupported: { type: boolean }

    AutomaticSelectionPolicy:
      type: object
      required: [enabled, allowDegraded, cooldownSeconds]
      properties:
        enabled: { type: boolean }
        allowDegraded: { type: boolean }
        cooldownSeconds: { type: integer, minimum: 60, maximum: 86400 }
        lastSelectedAt: { type: string, format: date-time }
        lastSelectedServerId: { type: string, format: uuid }

    UpdateAutomaticSelectionPolicyRequest:
      type: object
      additionalProperties: false
      required: [enabled, allowDegraded, cooldownSeconds]
      properties:
        enabled: { type: boolean }
        allowDegraded: { type: boolean }
        cooldownSeconds: { type: integer, minimum: 60, maximum: 86400 }

    AutomaticSelectionCandidate:
      type: object
      required: [serverId, serverName, protocol, health, priority, weight, signals]
      properties:
        serverId: { type: string, format: uuid }
        serverName: { type: string }
        protocol: { type: string }
        health: { type: string, enum: [ready, degraded] }
        priority: { type: integer }
        weight: { type: integer }
        signals:
          type: array
          items: { type: string }

    AutomaticSelectionDecision:
      type: object
      required: [vpnAccountId, status, reasons, eligibleCandidates, evaluatedAt, canApply]
      properties:
        vpnAccountId: { type: string, format: uuid }
        nodeGroupId: { type: string, format: uuid }
        selectionStrategy: { type: string, enum: [priority, weighted] }
        status: { type: string, enum: [selected, current, no_eligible_candidates, node_group_required, cooldown] }
        currentServerId: { type: string, format: uuid }
        selectedCandidate: { $ref: "#/components/schemas/AutomaticSelectionCandidate" }
        reasons:
          type: array
          items: { type: string }
        eligibleCandidates: { type: integer, minimum: 0 }
        evaluatedAt: { type: string, format: date-time }
        blockedUntil: { type: string, format: date-time }
        canApply: { type: boolean }

    AutomaticSelectionApplyResponse:
      type: object
      required: [decision, selectedServerId, changed, affectedServerIds, configDeploymentRequired]
      properties:
        decision: { $ref: "#/components/schemas/AutomaticSelectionDecision" }
        previousServerId: { type: string, format: uuid }
        selectedServerId: { type: string, format: uuid }
        changed: { type: boolean }
        affectedServerIds:
          type: array
          items: { type: string, format: uuid }
        configDeploymentRequired: { type: boolean }
