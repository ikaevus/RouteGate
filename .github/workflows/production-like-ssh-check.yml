name: Production-like SSH Check

# Temporary live diagnostic: verify the canonical SSH boundary and inspect
# whether the optional RouteGate-managed Prometheus component is installed.
on:
  workflow_dispatch:
  pull_request:
    branches:
      - main
    paths:
      - .github/workflows/production-like-ssh-check.yml

permissions:
  contents: read

jobs:
  ssh-check:
    runs-on: ubuntu-latest
    environment: production-like
    timeout-minutes: 5
    steps:
      - name: Configure SSH
        shell: bash
        env:
          ROUTEGATE_SSH_KEY: ${{ secrets.ROUTEGATE_SSH_KEY }}
          ROUTEGATE_KNOWN_HOSTS: ${{ secrets.ROUTEGATE_KNOWN_HOSTS }}
        run: |
          set -euo pipefail
          install -d -m 700 ~/.ssh
          printf '%s\n' "$ROUTEGATE_SSH_KEY" > ~/.ssh/routegate_ci
          chmod 600 ~/.ssh/routegate_ci
          printf '%s\n' "$ROUTEGATE_KNOWN_HOSTS" > ~/.ssh/known_hosts
          chmod 600 ~/.ssh/known_hosts

      - name: Verify production-like SSH access
        shell: bash
        env:
          ROUTEGATE_HOST: ${{ secrets.ROUTEGATE_HOST }}
          ROUTEGATE_USER: ${{ secrets.ROUTEGATE_USER }}
        run: |
          set -euo pipefail
          ssh \
            -i ~/.ssh/routegate_ci \
            -o BatchMode=yes \
            -o IdentitiesOnly=yes \
            -o StrictHostKeyChecking=yes \
            -o ConnectTimeout=10 \
            "$ROUTEGATE_USER@$ROUTEGATE_HOST" \
            'set -e; echo "user=$(whoami)"; echo "host=$(hostname)"; echo "sudo_user=$(sudo whoami)"; for svc in routegate-manager routegate-agent sing-box; do state=$(sudo systemctl is-active "$svc" 2>/dev/null || true); echo "$svc=${state:-unknown}"; done'

      - name: Inspect live Prometheus state
        shell: bash
        env:
          ROUTEGATE_HOST: ${{ secrets.ROUTEGATE_HOST }}
          ROUTEGATE_USER: ${{ secrets.ROUTEGATE_USER }}
        run: |
          set -euo pipefail
          ssh \
            -i ~/.ssh/routegate_ci \
            -o BatchMode=yes \
            -o IdentitiesOnly=yes \
            -o StrictHostKeyChecking=yes \
            -o ConnectTimeout=10 \
            "$ROUTEGATE_USER@$ROUTEGATE_HOST" \
            'sudo bash -s' <<'REMOTE'
          set -u

          if dpkg-query -W -f='${Status}' prometheus 2>/dev/null | grep -qx 'install ok installed'; then
            echo 'prometheus_package=installed'
          else
            echo 'prometheus_package=not-installed'
          fi

          if [[ -r /etc/routegate/install-state.env ]]; then
            managed=$(grep -E '^PROMETHEUS_MANAGED=' /etc/routegate/install-state.env | tail -n1 | cut -d= -f2- || true)
            echo "installer_prometheus_managed=${managed:-unset}"
          else
            echo 'installer_prometheus_managed=state-file-missing'
          fi

          for path in \
            /etc/prometheus/routegate.yml \
            /etc/prometheus/routegate.token \
            /etc/systemd/system/prometheus.service.d/routegate.conf \
            /var/lib/prometheus/routegate; do
            if [[ -e "$path" || -L "$path" ]]; then
              echo "managed_path:${path}=present"
            else
              echo "managed_path:${path}=absent"
            fi
          done

          echo "prometheus_enabled=$(systemctl is-enabled prometheus 2>/dev/null || true)"
          echo "prometheus_active=$(systemctl is-active prometheus 2>/dev/null || true)"

          listener=$(ss -ltn 2>/dev/null | awk '$4 ~ /:9090$/ {print $4; exit}')
          echo "prometheus_listener=${listener:-none}"

          if curl -fsS --max-time 5 http://127.0.0.1:9090/-/ready >/dev/null 2>&1; then
            echo 'prometheus_ready=yes'

            curl -fsS --max-time 5 http://127.0.0.1:9090/api/v1/targets > /tmp/routegate-prometheus-targets.json
            python3 - /tmp/routegate-prometheus-targets.json <<'PY'
          import json, sys
          with open(sys.argv[1], encoding='utf-8') as f:
              payload = json.load(f)
          active = payload.get('data', {}).get('activeTargets', [])
          routegate = []
          for item in active:
              labels = item.get('labels') or {}
              job = labels.get('job', '')
              if job.startswith('routegate-'):
                  routegate.append((job, item.get('health', 'unknown'), item.get('lastError') or ''))
          print(f'routegate_target_count={len(routegate)}')
          for job, health, error in sorted(routegate):
              print(f'target:{job}=health:{health};error:{error or "none"}')
          PY
            rm -f /tmp/routegate-prometheus-targets.json

            query='up%7Bjob%3D~%22routegate-.%2A%22%7D'
            curl -fsS --max-time 5 "http://127.0.0.1:9090/api/v1/query?query=${query}" > /tmp/routegate-prometheus-up.json
            python3 - /tmp/routegate-prometheus-up.json <<'PY'
          import json, sys
          with open(sys.argv[1], encoding='utf-8') as f:
              payload = json.load(f)
          result = payload.get('data', {}).get('result', [])
          print(f'routegate_up_series={len(result)}')
          for item in sorted(result, key=lambda x: x.get('metric', {}).get('job', '')):
              metric = item.get('metric') or {}
              value = item.get('value') or [None, 'unknown']
              print(f'up:{metric.get("job", "unknown")}={value[1]}')
          PY
            rm -f /tmp/routegate-prometheus-up.json
          else
            echo 'prometheus_ready=no'
          fi

          if [[ -d /var/lib/prometheus/routegate ]]; then
            echo "prometheus_storage_size=$(du -sh /var/lib/prometheus/routegate 2>/dev/null | awk '{print $1}')"
          fi
          REMOTE
