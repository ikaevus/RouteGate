name: Production-like SSH Check

on:
  workflow_dispatch:
  pull_request:
    branches:
      - main
    paths:
      - .github/workflows/production-like-ssh-check.yml

permissions:
  contents: read

jobs:
  ssh-check:
    runs-on: ubuntu-latest
    environment: production-like
    timeout-minutes: 5
    steps:
      - name: Configure SSH
        shell: bash
        env:
          ROUTEGATE_SSH_KEY: ${{ secrets.ROUTEGATE_SSH_KEY }}
          ROUTEGATE_KNOWN_HOSTS: ${{ secrets.ROUTEGATE_KNOWN_HOSTS }}
        run: |
          set -euo pipefail
          install -d -m 700 ~/.ssh
          printf '%s\n' "$ROUTEGATE_SSH_KEY" > ~/.ssh/routegate_ci
          chmod 600 ~/.ssh/routegate_ci
          printf '%s\n' "$ROUTEGATE_KNOWN_HOSTS" > ~/.ssh/known_hosts
          chmod 600 ~/.ssh/known_hosts

      - name: Inspect safe installer metadata
        shell: bash
        env:
          ROUTEGATE_HOST: ${{ secrets.ROUTEGATE_HOST }}
          ROUTEGATE_USER: ${{ secrets.ROUTEGATE_USER }}
        run: |
          set -euo pipefail
          ssh -i ~/.ssh/routegate_ci -o BatchMode=yes -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes -o ConnectTimeout=10 \
            "$ROUTEGATE_USER@$ROUTEGATE_HOST" 'sudo bash -s' <<'REMOTE'
          set -euo pipefail
          log=/var/log/routegate-installer.log
          if [[ -r "$log" ]]; then
            version=$(sed -n 's/.*\[RouteGate\] Downloading RouteGate \([^[:space:]]*\)\..*/\1/p' "$log" | tail -n1)
            [[ -n "$version" ]] || version=$(sed -n 's/.*Downloading RouteGate \([^[:space:]]*\)\..*/\1/p' "$log" | tail -n1)
            echo "installer_log=present"
            echo "recoverable_version=${version:-not-found}"
            success_count=$(grep -c 'RouteGate installation completed successfully' "$log" 2>/dev/null || true)
            echo "installer_success_markers=$success_count"
          else
            echo 'installer_log=missing'
            echo 'recoverable_version=not-found'
          fi
          if [[ -r /etc/routegate/manager.env ]]; then
            public_url=$(sed -n 's/^ROUTEGATE_PUBLIC_URL="\{0,1\}\([^"[:space:]]*\)"\{0,1\}$/\1/p' /etc/routegate/manager.env | tail -n1)
            echo "public_url=${public_url:-not-found}"
          fi
          echo "arch=$(dpkg --print-architecture)"
          echo "manager=$(systemctl is-active routegate-manager 2>/dev/null || true)"
          echo "agent=$(systemctl is-active routegate-agent 2>/dev/null || true)"
          echo "sing_box=$(systemctl is-active sing-box 2>/dev/null || true)"
          REMOTE
