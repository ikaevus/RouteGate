name: Production-like SSH Check

# Revalidate the canonical production-like SSH boundary and the outbound SMTP path
# required by managed Email Delivery.
on:
  workflow_dispatch:
  pull_request:
    branches:
      - main
    paths:
      - .github/workflows/production-like-ssh-check.yml

permissions:
  contents: read

jobs:
  ssh-check:
    runs-on: ubuntu-latest
    environment: production-like
    timeout-minutes: 5
    steps:
      - name: Configure SSH
        shell: bash
        env:
          ROUTEGATE_SSH_KEY: ${{ secrets.ROUTEGATE_SSH_KEY }}
          ROUTEGATE_KNOWN_HOSTS: ${{ secrets.ROUTEGATE_KNOWN_HOSTS }}
        run: |
          set -euo pipefail
          install -d -m 700 ~/.ssh
          printf '%s\n' "$ROUTEGATE_SSH_KEY" > ~/.ssh/routegate_ci
          chmod 600 ~/.ssh/routegate_ci
          printf '%s\n' "$ROUTEGATE_KNOWN_HOSTS" > ~/.ssh/known_hosts
          chmod 600 ~/.ssh/known_hosts

      - name: Verify production-like SSH access
        shell: bash
        env:
          ROUTEGATE_HOST: ${{ secrets.ROUTEGATE_HOST }}
          ROUTEGATE_USER: ${{ secrets.ROUTEGATE_USER }}
        run: |
          set -euo pipefail
          ssh \
            -i ~/.ssh/routegate_ci \
            -o BatchMode=yes \
            -o IdentitiesOnly=yes \
            -o StrictHostKeyChecking=yes \
            -o ConnectTimeout=10 \
            "$ROUTEGATE_USER@$ROUTEGATE_HOST" \
            'set -e; echo "user=$(whoami)"; echo "host=$(hostname)"; echo "sudo_user=$(sudo whoami)"; for svc in routegate-manager routegate-agent sing-box; do state=$(sudo systemctl is-active "$svc" 2>/dev/null || true); echo "$svc=${state:-unknown}"; done'

      - name: Verify production-like SMTP egress
        shell: bash
        env:
          ROUTEGATE_HOST: ${{ secrets.ROUTEGATE_HOST }}
          ROUTEGATE_USER: ${{ secrets.ROUTEGATE_USER }}
        run: |
          set -euo pipefail
          ssh \
            -i ~/.ssh/routegate_ci \
            -o BatchMode=yes \
            -o IdentitiesOnly=yes \
            -o StrictHostKeyChecking=yes \
            -o ConnectTimeout=10 \
            "$ROUTEGATE_USER@$ROUTEGATE_HOST" \
            'bash -s' <<'REMOTE'
          set -euo pipefail
          smtp_host=smtp.gmail.com

          for port in 465 587; do
            if timeout 10 bash -c "exec 3<>/dev/tcp/${smtp_host}/${port}"; then
              echo "${smtp_host}:${port}=reachable"
            else
              echo "${smtp_host}:${port}=unreachable" >&2
              exit 1
            fi
          done

          timeout 15 openssl s_client \
            -connect "${smtp_host}:465" \
            -servername "$smtp_host" \
            -brief \
            </dev/null >/dev/null 2>&1
          echo "${smtp_host}:465=tls-handshake-ok"

          timeout 15 openssl s_client \
            -starttls smtp \
            -connect "${smtp_host}:587" \
            -servername "$smtp_host" \
            -brief \
            </dev/null >/dev/null 2>&1
          echo "${smtp_host}:587=starttls-handshake-ok"
          REMOTE
