name: Production-like Ops

on:
  issues:
    types:
      - reopened
  workflow_dispatch:
    inputs:
      operation:
        description: Allow-listed production-like operation
        required: true
        type: choice
        options:
          - diagnose
          - diagnose-sing-box
          - diagnose-agent-task
          - validate
          - validate-deploy-rollback-cycle
          - restart-control-plane
          - restart-sing-box
          - restart-wireguard
          - restart-hysteria2
          - restart-mtproto
          - reconcile-mtproto-port-conflict
          - renew-certificate

permissions:
  contents: read
  issues: write

concurrency:
  group: routegate-production-like-ops
  cancel-in-progress: false

jobs:
  operate:
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event.issue.number == 268 &&
       github.event.issue.title == 'RouteGate Ops Bridge' &&
       github.event.issue.user.login == github.repository_owner)
    runs-on: ubuntu-24.04
    environment: production-like
    timeout-minutes: 20

    steps:
      - name: Checkout trusted main
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          ref: main
          fetch-depth: 1

      - name: Resolve allow-listed operation
        id: request
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          DISPATCH_OPERATION: ${{ inputs.operation }}
          REQUEST_BODY: ${{ github.event.issue.body }}
        run: |
          set -euo pipefail
          if [[ "$EVENT_NAME" == "workflow_dispatch" ]]; then
            operation="$DISPATCH_OPERATION"
          else
            case "$REQUEST_BODY" in
              'operation=diagnose') operation=diagnose ;;
              'operation=diagnose-sing-box') operation=diagnose-sing-box ;;
              'operation=diagnose-agent-task') operation=diagnose-agent-task ;;
              'operation=validate') operation=validate ;;
              'operation=validate-deploy-rollback-cycle') operation=validate-deploy-rollback-cycle ;;
              'operation=restart-control-plane') operation=restart-control-plane ;;
              'operation=restart-sing-box') operation=restart-sing-box ;;
              'operation=restart-wireguard') operation=restart-wireguard ;;
              'operation=restart-hysteria2') operation=restart-hysteria2 ;;
              'operation=restart-mtproto') operation=restart-mtproto ;;
              'operation=reconcile-mtproto-port-conflict') operation=reconcile-mtproto-port-conflict ;;
              'operation=renew-certificate') operation=renew-certificate ;;
              *)
                printf 'Unsupported ops request body.\n' >&2
                exit 2
                ;;
            esac
          fi

          case "$operation" in
            diagnose|diagnose-sing-box|diagnose-agent-task|validate|validate-deploy-rollback-cycle|restart-control-plane|restart-sing-box|restart-wireguard|restart-hysteria2|restart-mtproto|reconcile-mtproto-port-conflict|renew-certificate) ;;
            *) exit 2 ;;
          esac
          printf 'operation=%s\n' "$operation" >> "$GITHUB_OUTPUT"

      - name: Setup Go for rollback-cycle validation
        if: steps.request.outputs.operation == 'validate-deploy-rollback-cycle'
        uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6.5.0
        with:
          go-version: '1.26.x'
          cache-dependency-path: |
            backend/go.sum
            agent/go.sum

      - name: Setup Node.js for rollback-cycle validation
        if: steps.request.outputs.operation == 'validate-deploy-rollback-cycle'
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Build rollback-cycle validation bundle
        if: steps.request.outputs.operation == 'validate-deploy-rollback-cycle'
        id: rollback_bundle
        shell: bash
        env:
          VERSION: rollback-validation
          ARCHITECTURES: amd64
          OUTPUT_DIR: ${{ runner.temp }}/routegate-rollback-validation-dist
        run: |
          set -euo pipefail
          target_sha=$(git rev-parse HEAD)
          export COMMIT="$target_sha"
          ./scripts/build-release-bundle.sh
          bundle="${OUTPUT_DIR}/routegate-${VERSION}-linux-amd64.tar.gz"
          test -s "$bundle"
          bundle_sha=$(sha256sum "$bundle" | awk '{print $1}')
          printf 'target_sha=%s\n' "$target_sha" >> "$GITHUB_OUTPUT"
          printf 'bundle=%s\n' "$bundle" >> "$GITHUB_OUTPUT"
          printf 'bundle_sha=%s\n' "$bundle_sha" >> "$GITHUB_OUTPUT"

      - name: Validate ops scripts locally
        shell: bash
        run: |
          set -euo pipefail
          bash -n scripts/production-like-ops.sh
          bash -n scripts/production-like-task-diagnostics.sh
          bash -n scripts/deploy-production-like-bundle.sh
          bash -n scripts/validate-production-like-deploy.sh
          if command -v shellcheck >/dev/null 2>&1; then
            shellcheck scripts/production-like-ops.sh
            shellcheck scripts/production-like-task-diagnostics.sh
            shellcheck scripts/deploy-production-like-bundle.sh
            shellcheck scripts/validate-production-like-deploy.sh
          fi

      - name: Configure SSH
        shell: bash
        env:
          ROUTEGATE_SSH_KEY: ${{ secrets.ROUTEGATE_SSH_KEY }}
          ROUTEGATE_KNOWN_HOSTS: ${{ secrets.ROUTEGATE_KNOWN_HOSTS }}
        run: |
          set -euo pipefail
          install -d -m 700 ~/.ssh
          printf '%s\n' "$ROUTEGATE_SSH_KEY" > ~/.ssh/routegate_ci
          chmod 600 ~/.ssh/routegate_ci
          printf '%s\n' "$ROUTEGATE_KNOWN_HOSTS" > ~/.ssh/known_hosts
          chmod 600 ~/.ssh/known_hosts

      - name: Run allow-listed remote operation
        id: remote
        shell: bash
        env:
          ROUTEGATE_HOST: ${{ secrets.ROUTEGATE_HOST }}
          ROUTEGATE_USER: ${{ secrets.ROUTEGATE_USER }}
          OPERATION: ${{ steps.request.outputs.operation }}
          TARGET_SHA: ${{ steps.rollback_bundle.outputs.target_sha }}
          BUNDLE_FILE: ${{ steps.rollback_bundle.outputs.bundle }}
          BUNDLE_SHA: ${{ steps.rollback_bundle.outputs.bundle_sha }}
        run: |
          set -euo pipefail
          SSH=(ssh -i ~/.ssh/routegate_ci -o BatchMode=yes -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes -o ConnectTimeout=10)
          SCP=(scp -i ~/.ssh/routegate_ci -o BatchMode=yes -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes -o ConnectTimeout=10)
          output_file="${RUNNER_TEMP}/routegate-ops-output.txt"

          if [[ "$OPERATION" == "validate-deploy-rollback-cycle" ]]; then
            test -n "$TARGET_SHA"
            test -s "$BUNDLE_FILE"
            test -n "$BUNDLE_SHA"

            remote_prefix="/tmp/routegate-rollback-cycle-${GITHUB_RUN_ID}"
            remote_bundle_fail="${remote_prefix}-fail.tar.gz"
            remote_bundle_redeploy="${remote_prefix}-redeploy.tar.gz"
            remote_deploy="${remote_prefix}-deploy.sh"
            remote_fail_validate="${remote_prefix}-fail-validate.sh"
            remote_validate="${remote_prefix}-validate.sh"
            remote_core_fail="${remote_prefix}-core-fail.sh"
            remote_core_redeploy="${remote_prefix}-core-redeploy.sh"
            remote_ops="${remote_prefix}-ops.sh"
            remote_cycle="${remote_prefix}-cycle.sh"
            local_fail_validate="${RUNNER_TEMP}/routegate-forced-validation-failure.sh"
            local_cycle="${RUNNER_TEMP}/routegate-rollback-cycle.sh"

            cat >"$local_fail_validate" <<'FAIL_VALIDATE'
          #!/usr/bin/env bash
          set -euo pipefail
          printf '[rollback-cycle] intentional validation failure reached\n' >&2
          exit 42
          FAIL_VALIDATE

            cat >"$local_cycle" <<'CYCLE'
          #!/usr/bin/env bash
          set -euo pipefail
          target_sha=$1
          bundle_fail=$2
          bundle_redeploy=$3
          bundle_sha=$4
          deploy_script=$5
          fail_validate=$6
          validate_script=$7
          core_fail=$8
          core_redeploy=$9
          ops_script=${10}
          forced_log=$(mktemp /tmp/routegate-forced-rollback.XXXXXX.log)
          trap 'rm -f "$forced_log"' EXIT

          printf '[rollback-cycle] baseline validation starting\n'
          bash "$ops_script" validate

          set +e
          bash "$deploy_script" "$target_sha" "$bundle_fail" "$bundle_sha" "$fail_validate" "$core_fail" >"$forced_log" 2>&1
          forced_rc=$?
          set -e
          cat "$forced_log"
          if ((forced_rc == 0)); then
            printf '[rollback-cycle] expected forced deployment failure but deploy succeeded\n' >&2
            exit 1
          fi
          grep -Fq '[rollback-cycle] intentional validation failure reached' "$forced_log" \
            || { printf '[rollback-cycle] forced failure did not reach validation stage\n' >&2; exit 1; }
          grep -Fq 'Failure at stage=observability_validation; restoring production-like baseline.' "$forced_log" \
            || { printf '[rollback-cycle] deploy rollback trap was not observed\n' >&2; exit 1; }
          grep -Fq 'database rollback restored backup schema=' "$forced_log" \
            || { printf '[rollback-cycle] database restore success marker was not observed\n' >&2; exit 1; }
          if grep -Fq 'rollback reported an incomplete restore' "$forced_log"; then
            printf '[rollback-cycle] rollback reported an incomplete restore\n' >&2
            exit 1
          fi

          printf '[rollback-cycle] post-rollback validation starting\n'
          bash "$ops_script" validate

          printf '[rollback-cycle] clean redeploy starting\n'
          bash "$deploy_script" "$target_sha" "$bundle_redeploy" "$bundle_sha" "$validate_script" "$core_redeploy"

          printf '[rollback-cycle] post-redeploy validation starting\n'
          bash "$ops_script" validate
          printf '[rollback-cycle] deploy-forced-failure-rollback-redeploy PASSED\n'
          CYCLE
            chmod 0700 "$local_fail_validate" "$local_cycle"

            "${SCP[@]}" "$BUNDLE_FILE" "$ROUTEGATE_USER@$ROUTEGATE_HOST:$remote_bundle_fail"
            "${SCP[@]}" "$BUNDLE_FILE" "$ROUTEGATE_USER@$ROUTEGATE_HOST:$remote_bundle_redeploy"
            "${SCP[@]}" scripts/deploy-production-like-bundle.sh "$ROUTEGATE_USER@$ROUTEGATE_HOST:$remote_deploy"
            "${SCP[@]}" "$local_fail_validate" "$ROUTEGATE_USER@$ROUTEGATE_HOST:$remote_fail_validate"
            "${SCP[@]}" scripts/validate-production-like-deploy.sh "$ROUTEGATE_USER@$ROUTEGATE_HOST:$remote_validate"
            "${SCP[@]}" scripts/routegate-update-core.sh "$ROUTEGATE_USER@$ROUTEGATE_HOST:$remote_core_fail"
            "${SCP[@]}" scripts/routegate-update-core.sh "$ROUTEGATE_USER@$ROUTEGATE_HOST:$remote_core_redeploy"
            "${SCP[@]}" scripts/production-like-ops.sh "$ROUTEGATE_USER@$ROUTEGATE_HOST:$remote_ops"
            "${SCP[@]}" "$local_cycle" "$ROUTEGATE_USER@$ROUTEGATE_HOST:$remote_cycle"

            set +e
            "${SSH[@]}" "$ROUTEGATE_USER@$ROUTEGATE_HOST" \
              "sudo flock -w 600 /run/lock/routegate-production-like.lock bash '$remote_cycle' '$TARGET_SHA' '$remote_bundle_fail' '$remote_bundle_redeploy' '$BUNDLE_SHA' '$remote_deploy' '$remote_fail_validate' '$remote_validate' '$remote_core_fail' '$remote_core_redeploy' '$remote_ops'" >"$output_file" 2>&1
            rc=$?
            set -e
            "${SSH[@]}" "$ROUTEGATE_USER@$ROUTEGATE_HOST" \
              "rm -f '$remote_bundle_fail' '$remote_bundle_redeploy' '$remote_deploy' '$remote_fail_validate' '$remote_validate' '$remote_core_fail' '$remote_core_redeploy' '$remote_ops' '$remote_cycle'" || true
          else
            remote_script="/tmp/routegate-ops-${GITHUB_RUN_ID}.sh"
            if [[ "$OPERATION" == "diagnose-agent-task" ]]; then
              local_script="scripts/production-like-task-diagnostics.sh"
              remote_operation=""
            else
              local_script="scripts/production-like-ops.sh"
              remote_operation="$OPERATION"
            fi

            "${SCP[@]}" "$local_script" "$ROUTEGATE_USER@$ROUTEGATE_HOST:$remote_script"
            set +e
            if [[ -n "$remote_operation" ]]; then
              "${SSH[@]}" "$ROUTEGATE_USER@$ROUTEGATE_HOST" "sudo flock -w 600 /run/lock/routegate-production-like.lock bash '$remote_script' '$remote_operation'" >"$output_file" 2>&1
            else
              "${SSH[@]}" "$ROUTEGATE_USER@$ROUTEGATE_HOST" "sudo flock -w 600 /run/lock/routegate-production-like.lock bash '$remote_script'" >"$output_file" 2>&1
            fi
            rc=$?
            set -e
            "${SSH[@]}" "$ROUTEGATE_USER@$ROUTEGATE_HOST" "rm -f '$remote_script'" || true
          fi

          cat "$output_file"
          printf 'rc=%s\n' "$rc" >> "$GITHUB_OUTPUT"

      - name: Publish sanitized audit result
        if: always() && steps.request.outcome == 'success'
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          OPERATION: ${{ steps.request.outputs.operation }}
          REMOTE_RC: ${{ steps.remote.outputs.rc }}
          EVENT_NAME: ${{ github.event_name }}
        run: |
          set -euo pipefail
          rc=${REMOTE_RC:-1}
          if [[ "$rc" == 0 ]]; then
            status=PASSED
          else
            status=FAILED
          fi

          output_file="${RUNNER_TEMP}/routegate-ops-output.txt"
          if [[ -f "$output_file" ]]; then
            summary=$(tail -n 80 "$output_file")
          else
            summary='Remote operation did not produce output.'
          fi

          run_url="https://github.com/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"
          body=$(jq -n \
            --arg operation "$OPERATION" \
            --arg status "$status" \
            --arg summary "$summary" \
            --arg run_url "$run_url" \
            '{body:("Ops operation `" + $operation + "` **" + $status + "**.\n\n```text\n" + $summary + "\n```\n\nActions audit: " + $run_url)}')
          gh api --method POST "repos/${GITHUB_REPOSITORY}/issues/268/comments" --input - <<<"$body" >/dev/null

          if [[ "$EVENT_NAME" == issues ]]; then
            baseline='Reserved control issue for RouteGate production-like operations.\n\nSet only an exact allow-listed `operation=...` request while this issue is closed, then reopen it. The workflow clears the request by closing the issue after every run. Arbitrary issue text is never executed as shell input.'
            patch=$(jq -n --arg body "$baseline" '{state:"closed",body:$body}')
            gh api --method PATCH "repos/${GITHUB_REPOSITORY}/issues/268" --input - <<<"$patch" >/dev/null
          fi

      - name: Propagate remote failure
        if: always() && steps.request.outcome == 'success'
        shell: bash
        env:
          REMOTE_RC: ${{ steps.remote.outputs.rc }}
        run: |
          set -euo pipefail
          rc=${REMOTE_RC:-1}
          [[ "$rc" == 0 ]]
