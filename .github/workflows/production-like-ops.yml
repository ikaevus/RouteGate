name: Production-like Ops

on:
  issues:
    types:
      - reopened
  workflow_dispatch:
    inputs:
      operation:
        description: Allow-listed production-like operation
        required: true
        type: choice
        options:
          - diagnose
          - diagnose-sing-box
          - diagnose-agent-task
          - validate
          - validate-deploy-rollback-cycle
          - restart-control-plane
          - restart-sing-box
          - restart-wireguard
          - restart-hysteria2
          - restart-mtproto
          - reconcile-mtproto-port-conflict
          - renew-certificate
          - preflight-applied-client-settings-155
          - update-manager
          - publish-bootstrap
      commit:
        description: update-manager or publish-bootstrap - full 40-character main commit with a successful RouteGate CI run
        required: false
        type: string
        default: ''

permissions:
  actions: read
  contents: read
  issues: write

concurrency:
  group: routegate-production-like-ops
  cancel-in-progress: false

jobs:
  operate:
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event.issue.number == 268 &&
       github.event.issue.title == 'RouteGate Ops Bridge' &&
       github.event.issue.user.login == github.repository_owner)
    runs-on: ubuntu-24.04
    environment: production-like
    timeout-minutes: 45

    steps:
      - name: Checkout trusted main
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          ref: main
          fetch-depth: 1

      - name: Resolve allow-listed operation
        id: request
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          DISPATCH_OPERATION: ${{ inputs.operation }}
          DISPATCH_COMMIT: ${{ inputs.commit }}
          REQUEST_BODY: ${{ github.event.issue.body }}
        run: |
          set -euo pipefail
          commit=""
          if [[ "$EVENT_NAME" == "workflow_dispatch" ]]; then
            operation="$DISPATCH_OPERATION"
            commit="${DISPATCH_COMMIT:-}"
          elif [[ "$REQUEST_BODY" =~ ^operation=(update-manager|publish-bootstrap)\ commit=([0-9a-f]{40})$ ]]; then
            # Parameterized requests accept only: a full lowercase commit id and
            # nothing else (no trailing newline, spaces or other text).
            operation="${BASH_REMATCH[1]}"
            commit="${BASH_REMATCH[2]}"
          else
            case "$REQUEST_BODY" in
              'operation=diagnose') operation=diagnose ;;
              'operation=diagnose-sing-box') operation=diagnose-sing-box ;;
              'operation=diagnose-agent-task') operation=diagnose-agent-task ;;
              'operation=validate') operation=validate ;;
              'operation=validate-deploy-rollback-cycle') operation=validate-deploy-rollback-cycle ;;
              'operation=restart-control-plane') operation=restart-control-plane ;;
              'operation=restart-sing-box') operation=restart-sing-box ;;
              'operation=restart-wireguard') operation=restart-wireguard ;;
              'operation=restart-hysteria2') operation=restart-hysteria2 ;;
              'operation=restart-mtproto') operation=restart-mtproto ;;
              'operation=reconcile-mtproto-port-conflict') operation=reconcile-mtproto-port-conflict ;;
              'operation=renew-certificate') operation=renew-certificate ;;
              'operation=preflight-applied-client-settings-155') operation=preflight-applied-client-settings-155 ;;
              *)
                printf 'Unsupported ops request body.\n' >&2
                exit 2
                ;;
            esac
          fi

          case "$operation" in
            diagnose|diagnose-sing-box|diagnose-agent-task|validate|validate-deploy-rollback-cycle|restart-control-plane|restart-sing-box|restart-wireguard|restart-hysteria2|restart-mtproto|reconcile-mtproto-port-conflict|renew-certificate|preflight-applied-client-settings-155|update-manager|publish-bootstrap) ;;
            *) exit 2 ;;
          esac
          # The database preflight and the Manager update run with
          # production-like secrets only from the trusted main workflow
          # definition, never a dispatch from another ref.
          if [[ ( "$operation" == "preflight-applied-client-settings-155" || "$operation" == "update-manager" || "$operation" == "publish-bootstrap" ) && "$EVENT_NAME" == "workflow_dispatch" && "$GITHUB_REF" != "refs/heads/main" ]]; then
            printf 'The %s operation can only be dispatched from main.\n' "$operation" >&2
            exit 2
          fi
          if [[ "$operation" == "update-manager" || "$operation" == "publish-bootstrap" ]]; then
            [[ "$commit" =~ ^[0-9a-f]{40}$ ]] || { printf 'Operation requires a full 40-character lowercase commit id.\n' >&2; exit 2; }
          elif [[ -n "$commit" ]]; then
            printf 'The commit input is accepted only by update-manager and publish-bootstrap.\n' >&2
            exit 2
          fi
          printf 'operation=%s\n' "$operation" >> "$GITHUB_OUTPUT"
          printf 'commit=%s\n' "$commit" >> "$GITHUB_OUTPUT"

      - name: Verify update-manager target is on main with a successful CI run
        if: steps.request.outputs.operation == 'update-manager' || steps.request.outputs.operation == 'publish-bootstrap'
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          TARGET_SHA: ${{ steps.request.outputs.commit }}
        run: |
          set -euo pipefail
          [[ "$TARGET_SHA" =~ ^[0-9a-f]{40}$ ]]
          runs=$(gh api "repos/${GITHUB_REPOSITORY}/actions/workflows/ci.yml/runs?head_sha=${TARGET_SHA}&branch=main&event=push&status=success&per_page=1" --jq '.total_count')
          [[ "$runs" =~ ^[0-9]+$ && "$runs" -gt 0 ]] || { printf 'No successful RouteGate CI push run on main for %s.\n' "$TARGET_SHA" >&2; exit 1; }
          printf 'target=%s successful_main_ci_runs=%s\n' "$TARGET_SHA" "$runs"

      - name: Checkout pinned update-manager target
        if: steps.request.outputs.operation == 'update-manager' || steps.request.outputs.operation == 'publish-bootstrap'
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          ref: ${{ steps.request.outputs.commit }}
          path: target
          fetch-depth: 0
          persist-credentials: false

      - name: Verify pinned checkout is in main
        if: steps.request.outputs.operation == 'update-manager' || steps.request.outputs.operation == 'publish-bootstrap'
        shell: bash
        env:
          TARGET_SHA: ${{ steps.request.outputs.commit }}
        run: |
          set -euo pipefail
          [[ "$(git -C target rev-parse HEAD)" == "$TARGET_SHA" ]]
          git -C target merge-base --is-ancestor "$TARGET_SHA" refs/remotes/origin/main \
            || { printf 'Commit %s is not contained in main.\n' "$TARGET_SHA" >&2; exit 1; }
          printf 'target=%s contained-in=main\n' "$TARGET_SHA"

      - name: Setup Go for rollback-cycle validation
        if: steps.request.outputs.operation == 'validate-deploy-rollback-cycle'
        uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6.5.0
        with:
          go-version: '1.26.x'
          cache-dependency-path: |
            backend/go.sum
            agent/go.sum

      - name: Setup Node.js for rollback-cycle validation
        if: steps.request.outputs.operation == 'validate-deploy-rollback-cycle'
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Build rollback-cycle validation bundle
        if: steps.request.outputs.operation == 'validate-deploy-rollback-cycle'
        id: rollback_bundle
        shell: bash
        env:
          VERSION: rollback-validation
          ARCHITECTURES: amd64
          OUTPUT_DIR: ${{ runner.temp }}/routegate-rollback-validation-dist
        run: |
          set -euo pipefail
          target_sha=$(git rev-parse HEAD)
          export COMMIT="$target_sha"
          ./scripts/build-release-bundle.sh
          bundle="${OUTPUT_DIR}/routegate-${VERSION}-linux-amd64.tar.gz"
          test -s "$bundle"
          bundle_sha=$(sha256sum "$bundle" | awk '{print $1}')
          printf 'target_sha=%s\n' "$target_sha" >> "$GITHUB_OUTPUT"
          printf 'bundle=%s\n' "$bundle" >> "$GITHUB_OUTPUT"
          printf 'bundle_sha=%s\n' "$bundle_sha" >> "$GITHUB_OUTPUT"

      - name: Setup Go for the Manager update
        if: steps.request.outputs.operation == 'update-manager' || steps.request.outputs.operation == 'publish-bootstrap'
        uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6.5.0
        with:
          go-version: '1.26.x'
          cache-dependency-path: |
            target/backend/go.sum
            target/agent/go.sum

      - name: Setup Node.js for the Manager update
        if: steps.request.outputs.operation == 'update-manager' || steps.request.outputs.operation == 'publish-bootstrap'
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: target/frontend/package-lock.json

      - name: Build pinned Manager update bundle
        if: steps.request.outputs.operation == 'update-manager' || steps.request.outputs.operation == 'publish-bootstrap'
        id: manager_bundle
        shell: bash
        working-directory: target
        env:
          VERSION: production-like
          COMMIT: ${{ steps.request.outputs.commit }}
          AGENT_BUNDLE_BASE_URL: https://us.routegate.org/bootstrap/${{ steps.request.outputs.commit }}
          ARCHITECTURES: ${{ steps.request.outputs.operation == 'publish-bootstrap' && 'amd64 arm64' || 'amd64' }}
          OUTPUT_DIR: ${{ runner.temp }}/routegate-manager-update-dist
        run: |
          set -euo pipefail
          [[ "$(git rev-parse HEAD)" == "$COMMIT" ]]
          ./scripts/build-release-bundle.sh
          bundle="${OUTPUT_DIR}/routegate-${VERSION}-linux-amd64.tar.gz"
          test -s "$bundle"
          tar -xzOf "$bundle" ./metadata/manifest.env | grep -Fxq "COMMIT=${COMMIT}"
          bundle_sha=$(sha256sum "$bundle" | awk '{print $1}')
          printf 'bundle=%s\n' "$bundle" >> "$GITHUB_OUTPUT"
          printf 'bundle_sha=%s\n' "$bundle_sha" >> "$GITHUB_OUTPUT"
          printf 'arm64=%s/routegate-production-like-linux-arm64.tar.gz\n' "$OUTPUT_DIR" >> "$GITHUB_OUTPUT"
          printf 'checksums=%s/SHA256SUMS\n' "$OUTPUT_DIR" >> "$GITHUB_OUTPUT"
          printf 'checksums_sha=%s\n' "$(sha256sum "$OUTPUT_DIR/SHA256SUMS" | awk '{print $1}')" >> "$GITHUB_OUTPUT"
          printf 'bundle commit=%s sha256=%s\n' "$COMMIT" "$bundle_sha"

      - name: Validate ops scripts locally
        shell: bash
        run: |
          set -euo pipefail
          bash -n scripts/production-like-ops.sh
          bash -n scripts/production-like-task-diagnostics.sh
          bash -n scripts/deploy-production-like-bundle.sh
          bash -n scripts/validate-production-like-deploy.sh
          bash -n scripts/production-like-preflight-applied-client-settings.sh
          bash -n scripts/production-like-update-manager.sh
          bash -n scripts/routegate-update-core.sh
          bash -n scripts/routegate-update-role.sh
          if command -v shellcheck >/dev/null 2>&1; then
            shellcheck -x scripts/production-like-ops.sh
            shellcheck -x scripts/production-like-task-diagnostics.sh
            shellcheck -x scripts/deploy-production-like-bundle.sh
            shellcheck -x scripts/validate-production-like-deploy.sh
            shellcheck -x scripts/production-like-preflight-applied-client-settings.sh
            shellcheck -x scripts/production-like-update-manager.sh
          fi

      - name: Configure SSH
        shell: bash
        env:
          ROUTEGATE_SSH_KEY: ${{ secrets.ROUTEGATE_SSH_KEY }}
          ROUTEGATE_KNOWN_HOSTS: ${{ secrets.ROUTEGATE_KNOWN_HOSTS }}
        run: |
          set -euo pipefail
          install -d -m 700 ~/.ssh
          printf '%s\n' "$ROUTEGATE_SSH_KEY" > ~/.ssh/routegate_ci
          chmod 600 ~/.ssh/routegate_ci
          printf '%s\n' "$ROUTEGATE_KNOWN_HOSTS" > ~/.ssh/known_hosts
          chmod 600 ~/.ssh/known_hosts

      - name: Run allow-listed remote operation
        id: remote
        shell: bash
        env:
          ROUTEGATE_HOST: ${{ secrets.ROUTEGATE_HOST }}
          ROUTEGATE_USER: ${{ secrets.ROUTEGATE_USER }}
          OPERATION: ${{ steps.request.outputs.operation }}
          TARGET_SHA: ${{ steps.rollback_bundle.outputs.target_sha }}
          BUNDLE_FILE: ${{ steps.rollback_bundle.outputs.bundle }}
          BUNDLE_SHA: ${{ steps.rollback_bundle.outputs.bundle_sha }}
          MANAGER_COMMIT: ${{ steps.request.outputs.commit }}
          MANAGER_BUNDLE: ${{ steps.manager_bundle.outputs.bundle }}
          MANAGER_BUNDLE_SHA: ${{ steps.manager_bundle.outputs.bundle_sha }}
          BOOTSTRAP_ARM64: ${{ steps.manager_bundle.outputs.arm64 }}
          BOOTSTRAP_CHECKSUMS: ${{ steps.manager_bundle.outputs.checksums }}
          BOOTSTRAP_CHECKSUMS_SHA: ${{ steps.manager_bundle.outputs.checksums_sha }}
        run: |
          set -euo pipefail
          SSH=(ssh -i ~/.ssh/routegate_ci -o BatchMode=yes -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes -o ConnectTimeout=10)
          SCP=(scp -i ~/.ssh/routegate_ci -o BatchMode=yes -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes -o ConnectTimeout=10)
          output_file="${RUNNER_TEMP}/routegate-ops-output.txt"

          if [[ "$OPERATION" == "validate-deploy-rollback-cycle" ]]; then
            test -n "$TARGET_SHA"
            test -s "$BUNDLE_FILE"
            test -n "$BUNDLE_SHA"

            remote_prefix="/tmp/routegate-rollback-cycle-${GITHUB_RUN_ID}"
            remote_bundle_fail="${remote_prefix}-fail.tar.gz"
            remote_bundle_redeploy="${remote_prefix}-redeploy.tar.gz"
            remote_deploy="${remote_prefix}-deploy.sh"
            remote_fail_validate="${remote_prefix}-fail-validate.sh"
            remote_validate="${remote_prefix}-validate.sh"
            remote_core_fail="${remote_prefix}-core-fail.sh"
            remote_core_redeploy="${remote_prefix}-core-redeploy.sh"
            remote_ops="${remote_prefix}-ops.sh"
            remote_cycle="${remote_prefix}-cycle.sh"
            local_fail_validate="${RUNNER_TEMP}/routegate-forced-validation-failure.sh"
            local_cycle="${RUNNER_TEMP}/routegate-rollback-cycle.sh"

            cat >"$local_fail_validate" <<'FAIL_VALIDATE'
          #!/usr/bin/env bash
          set -euo pipefail
          printf '[rollback-cycle] intentional validation failure reached\n' >&2
          exit 42
          FAIL_VALIDATE

            cat >"$local_cycle" <<'CYCLE'
          #!/usr/bin/env bash
          set -euo pipefail
          target_sha=$1
          bundle_fail=$2
          bundle_redeploy=$3
          bundle_sha=$4
          deploy_script=$5
          fail_validate=$6
          validate_script=$7
          core_fail=$8
          core_redeploy=$9
          ops_script=${10}
          forced_log=$(mktemp /tmp/routegate-forced-rollback.XXXXXX.log)
          trap 'rm -f "$forced_log"' EXIT

          printf '[rollback-cycle] baseline validation starting\n'
          bash "$ops_script" validate

          set +e
          bash "$deploy_script" "$target_sha" "$bundle_fail" "$bundle_sha" "$fail_validate" "$core_fail" >"$forced_log" 2>&1
          forced_rc=$?
          set -e
          cat "$forced_log"
          if ((forced_rc == 0)); then
            printf '[rollback-cycle] expected forced deployment failure but deploy succeeded\n' >&2
            exit 1
          fi
          grep -Fq '[rollback-cycle] intentional validation failure reached' "$forced_log" \
            || { printf '[rollback-cycle] forced failure did not reach validation stage\n' >&2; exit 1; }
          grep -Fq 'Failure at stage=observability_validation; restoring production-like baseline.' "$forced_log" \
            || { printf '[rollback-cycle] deploy rollback trap was not observed\n' >&2; exit 1; }
          grep -Fq 'database rollback restored backup schema=' "$forced_log" \
            || { printf '[rollback-cycle] database restore success marker was not observed\n' >&2; exit 1; }
          if grep -Fq 'rollback reported an incomplete restore' "$forced_log"; then
            printf '[rollback-cycle] rollback reported an incomplete restore\n' >&2
            exit 1
          fi

          printf '[rollback-cycle] post-rollback validation starting\n'
          bash "$ops_script" validate

          printf '[rollback-cycle] clean redeploy starting\n'
          bash "$deploy_script" "$target_sha" "$bundle_redeploy" "$bundle_sha" "$validate_script" "$core_redeploy"

          printf '[rollback-cycle] post-redeploy validation starting\n'
          bash "$ops_script" validate
          printf '[rollback-cycle] deploy-forced-failure-rollback-redeploy PASSED\n'
          CYCLE
            chmod 0700 "$local_fail_validate" "$local_cycle"

            "${SCP[@]}" "$BUNDLE_FILE" "$ROUTEGATE_USER@$ROUTEGATE_HOST:$remote_bundle_fail"
            "${SCP[@]}" "$BUNDLE_FILE" "$ROUTEGATE_USER@$ROUTEGATE_HOST:$remote_bundle_redeploy"
            "${SCP[@]}" scripts/deploy-production-like-bundle.sh "$ROUTEGATE_USER@$ROUTEGATE_HOST:$remote_deploy"
            "${SCP[@]}" "$local_fail_validate" "$ROUTEGATE_USER@$ROUTEGATE_HOST:$remote_fail_validate"
            "${SCP[@]}" scripts/validate-production-like-deploy.sh "$ROUTEGATE_USER@$ROUTEGATE_HOST:$remote_validate"
            "${SCP[@]}" scripts/routegate-update-core.sh "$ROUTEGATE_USER@$ROUTEGATE_HOST:$remote_core_fail"
            "${SCP[@]}" scripts/routegate-update-core.sh "$ROUTEGATE_USER@$ROUTEGATE_HOST:$remote_core_redeploy"
            "${SCP[@]}" scripts/production-like-ops.sh "$ROUTEGATE_USER@$ROUTEGATE_HOST:$remote_ops"
            "${SCP[@]}" "$local_cycle" "$ROUTEGATE_USER@$ROUTEGATE_HOST:$remote_cycle"

            set +e
            "${SSH[@]}" "$ROUTEGATE_USER@$ROUTEGATE_HOST" \
              "sudo flock -w 600 /run/lock/routegate-production-like.lock bash '$remote_cycle' '$TARGET_SHA' '$remote_bundle_fail' '$remote_bundle_redeploy' '$BUNDLE_SHA' '$remote_deploy' '$remote_fail_validate' '$remote_validate' '$remote_core_fail' '$remote_core_redeploy' '$remote_ops'" >"$output_file" 2>&1
            rc=$?
            set -e
            "${SSH[@]}" "$ROUTEGATE_USER@$ROUTEGATE_HOST" \
              "rm -f '$remote_bundle_fail' '$remote_bundle_redeploy' '$remote_deploy' '$remote_fail_validate' '$remote_validate' '$remote_core_fail' '$remote_core_redeploy' '$remote_ops' '$remote_cycle'" || true
          elif [[ "$OPERATION" == "preflight-applied-client-settings-155" ]]; then
            # Fixed files from the trusted main checkout only: the pinned SQL
            # (verified again by SHA-256 on the host) and its read-only runner.
            remote_prefix="/tmp/routegate-preflight-${GITHUB_RUN_ID}"
            remote_runner="${remote_prefix}.sh"
            remote_sql="${remote_prefix}.sql"
            set +e
            if "${SCP[@]}" scripts/production-like-preflight-applied-client-settings.sh "$ROUTEGATE_USER@$ROUTEGATE_HOST:$remote_runner" \
              && "${SCP[@]}" docs/operations/applied-client-settings/preflight-schema-155.sql "$ROUTEGATE_USER@$ROUTEGATE_HOST:$remote_sql"; then
              "${SSH[@]}" "$ROUTEGATE_USER@$ROUTEGATE_HOST" \
                "sudo flock -w 600 /run/lock/routegate-production-like.lock bash '$remote_runner' '$remote_sql'" >"$output_file" 2>&1
              rc=$?
            else
              printf '[routegate-preflight] ERROR: could not copy the preflight files to the host\n' >"$output_file"
              rc=4
            fi
            set -e
            "${SSH[@]}" "$ROUTEGATE_USER@$ROUTEGATE_HOST" "rm -f '$remote_runner' '$remote_sql'" || true
          elif [[ "$OPERATION" == "publish-bootstrap" ]]; then
            [[ "$MANAGER_COMMIT" =~ ^[0-9a-f]{40}$ && "$BOOTSTRAP_CHECKSUMS_SHA" =~ ^[0-9a-f]{64}$ ]]
            remote_prefix="/tmp/routegate-publish-bootstrap-${GITHUB_RUN_ID}"
            local_files=(scripts/production-like-publish-bootstrap.py "$MANAGER_BUNDLE" "$BOOTSTRAP_ARM64" "$BOOTSTRAP_CHECKSUMS")
            remote_files=("${remote_prefix}.py" "${remote_prefix}-amd64.tar.gz" "${remote_prefix}-arm64.tar.gz" "${remote_prefix}-SHA256SUMS")
            copied=1
            for i in "${!local_files[@]}"; do
              "${SCP[@]}" "${local_files[$i]}" "$ROUTEGATE_USER@$ROUTEGATE_HOST:${remote_files[$i]}" || { copied=0; break; }
            done
            set +e
            if ((copied == 1)); then
              "${SSH[@]}" "$ROUTEGATE_USER@$ROUTEGATE_HOST" \
                "sudo flock -w 600 /run/lock/routegate-production-like.lock python3 '${remote_files[0]}' '$MANAGER_COMMIT' '${remote_files[1]}' '${remote_files[2]}' '${remote_files[3]}' '$BOOTSTRAP_CHECKSUMS_SHA'" >"$output_file" 2>&1
              rc=$?
            else
              printf '[routegate-bootstrap] ERROR: could not copy publication files; nothing was changed\n' >"$output_file"
              rc=2
            fi
            set -e
            "${SSH[@]}" "$ROUTEGATE_USER@$ROUTEGATE_HOST" "rm -f $(printf "'%s' " "${remote_files[@]}")" || true
          elif [[ "$OPERATION" == "update-manager" ]]; then
            # The bundle is built from the pinned, verified commit; the update
            # engine and the pinned SQL come from the trusted main checkout.
            [[ "$MANAGER_COMMIT" =~ ^[0-9a-f]{40}$ && "$MANAGER_BUNDLE_SHA" =~ ^[0-9a-f]{64}$ ]]
            test -s "$MANAGER_BUNDLE"
            remote_prefix="/tmp/routegate-update-manager-${GITHUB_RUN_ID}"
            remote_files=(
              "${remote_prefix}-bundle.tar.gz"
              "${remote_prefix}-runner.sh"
              "${remote_prefix}-core.sh"
              "${remote_prefix}-role.sh"
              "${remote_prefix}-down-runner.sh"
              "${remote_prefix}-preflight.sql"
              "${remote_prefix}-postflight.sql"
            )
            local_files=(
              "$MANAGER_BUNDLE"
              scripts/production-like-update-manager.sh
              scripts/routegate-update-core.sh
              scripts/routegate-update-role.sh
              scripts/deploy-production-like-bundle.sh
              docs/operations/applied-client-settings/preflight-schema-155.sql
              docs/operations/applied-client-settings/postflight-schema-158.sql
            )
            copied=1
            for i in "${!local_files[@]}"; do
              "${SCP[@]}" "${local_files[$i]}" "$ROUTEGATE_USER@$ROUTEGATE_HOST:${remote_files[$i]}" || { copied=0; break; }
            done
            set +e
            if ((copied == 1)); then
              # Connection errors can name the host, port, user or database.
              "${SSH[@]}" "$ROUTEGATE_USER@$ROUTEGATE_HOST" \
                "sudo flock -w 600 /run/lock/routegate-production-like.lock bash '${remote_files[1]}' '$MANAGER_COMMIT' '${remote_files[0]}' '$MANAGER_BUNDLE_SHA' '${remote_files[2]}' '${remote_files[3]}' '${remote_files[4]}' '${remote_files[5]}' '${remote_files[6]}'" 2>&1 \
                | sed -E -e 's#postgres(ql)?://[^[:space:]]*#<redacted-url>#g' \
                  -e 's#(connection to server|could not connect|password authentication|no pg_hba|FATAL:).*#\1 <details redacted>#' >"$output_file"
              rc=${PIPESTATUS[0]}
            else
              printf '[routegate-manager-update] ERROR: could not copy the update files to the host; nothing was changed\n' >"$output_file"
              rc=2
            fi
            set -e
            "${SSH[@]}" "$ROUTEGATE_USER@$ROUTEGATE_HOST" "rm -f $(printf "'%s' " "${remote_files[@]}")" || true
          else
            remote_script="/tmp/routegate-ops-${GITHUB_RUN_ID}.sh"
            if [[ "$OPERATION" == "diagnose-agent-task" ]]; then
              local_script="scripts/production-like-task-diagnostics.sh"
              remote_operation=""
            else
              local_script="scripts/production-like-ops.sh"
              remote_operation="$OPERATION"
            fi

            "${SCP[@]}" "$local_script" "$ROUTEGATE_USER@$ROUTEGATE_HOST:$remote_script"
            set +e
            if [[ -n "$remote_operation" ]]; then
              "${SSH[@]}" "$ROUTEGATE_USER@$ROUTEGATE_HOST" "sudo flock -w 600 /run/lock/routegate-production-like.lock bash '$remote_script' '$remote_operation'" >"$output_file" 2>&1
            else
              "${SSH[@]}" "$ROUTEGATE_USER@$ROUTEGATE_HOST" "sudo flock -w 600 /run/lock/routegate-production-like.lock bash '$remote_script'" >"$output_file" 2>&1
            fi
            rc=$?
            set -e
            "${SSH[@]}" "$ROUTEGATE_USER@$ROUTEGATE_HOST" "rm -f '$remote_script'" || true
          fi

          if [[ "$OPERATION" == "preflight-applied-client-settings-155" ]]; then
            # The full P0-P7 result (node names, account ids) goes to the
            # artifact only; the log keeps the runner's status lines.
            grep -E '^\[routegate-preflight\]' "$output_file" || true
          elif [[ "$OPERATION" == "update-manager" ]]; then
            # Likewise the full preflight/postflight output of the update.
            grep -E '^\[routegate-(manager-update|update)\]' "$output_file" || true
          else
            cat "$output_file"
          fi
          printf 'rc=%s\n' "$rc" >> "$GITHUB_OUTPUT"

      - name: Upload full preflight result
        if: always() && steps.request.outputs.operation == 'preflight-applied-client-settings-155'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: routegate-preflight-applied-client-settings-155-${{ github.run_id }}
          path: ${{ runner.temp }}/routegate-ops-output.txt
          if-no-files-found: warn
          retention-days: 7

      - name: Upload full Manager update result
        if: always() && steps.request.outputs.operation == 'update-manager'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: routegate-update-manager-${{ github.run_id }}
          path: ${{ runner.temp }}/routegate-ops-output.txt
          if-no-files-found: warn
          retention-days: 7

      - name: Publish sanitized audit result
        if: always() && steps.request.outcome == 'success'
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          OPERATION: ${{ steps.request.outputs.operation }}
          REMOTE_RC: ${{ steps.remote.outputs.rc }}
          EVENT_NAME: ${{ github.event_name }}
          MANAGER_COMMIT: ${{ steps.request.outputs.commit }}
        run: |
          set -euo pipefail
          rc=${REMOTE_RC:-1}
          if [[ "$rc" == 0 ]]; then
            status=PASSED
          else
            status=FAILED
          fi

          output_file="${RUNNER_TEMP}/routegate-ops-output.txt"
          if [[ "$OPERATION" == "preflight-applied-client-settings-155" ]]; then
            if [[ -f "$output_file" ]]; then
              summary=$(grep -E '^\[routegate-preflight\]' "$output_file" || true)
            else
              summary='Remote operation did not produce output.'
            fi
            summary="${summary}"$'\n\n'"Full P0-P7 result: artifact routegate-preflight-applied-client-settings-155-${GITHUB_RUN_ID} of the run below (kept 7 days). PASSED only means the read-only checks completed; blocking results in P1-P4 still stop the update."
          elif [[ "$OPERATION" == "update-manager" ]]; then
            if [[ -f "$output_file" ]]; then
              summary=$(grep -E '^\[routegate-(manager-update|update)\]' "$output_file" | tail -n 80 || true)
            else
              summary='Remote operation did not produce output.'
            fi
            summary="target commit=${MANAGER_COMMIT}"$'\n'"${summary}"$'\n\n'"Full preflight P0-P7 and postflight Q0-Q6: artifact routegate-update-manager-${GITHUB_RUN_ID} of the run below (kept 7 days)."
          elif [[ -f "$output_file" ]]; then
            summary=$(tail -n 80 "$output_file")
          else
            summary='Remote operation did not produce output.'
          fi

          run_url="https://github.com/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"
          body=$(jq -n \
            --arg operation "$OPERATION" \
            --arg status "$status" \
            --arg summary "$summary" \
            --arg run_url "$run_url" \
            '{body:("Ops operation `" + $operation + "` **" + $status + "**.\n\n```text\n" + $summary + "\n```\n\nActions audit: " + $run_url)}')
          gh api --method POST "repos/${GITHUB_REPOSITORY}/issues/268/comments" --input - <<<"$body" >/dev/null

          if [[ "$EVENT_NAME" == issues ]]; then
            baseline='Reserved control issue for RouteGate production-like operations.\n\nSet only an exact allow-listed `operation=...` request while this issue is closed, then reopen it. The workflow clears the request by closing the issue after every run. Arbitrary issue text is never executed as shell input.'
            patch=$(jq -n --arg body "$baseline" '{state:"closed",body:$body}')
            gh api --method PATCH "repos/${GITHUB_REPOSITORY}/issues/268" --input - <<<"$patch" >/dev/null
          fi

      - name: Propagate remote failure
        if: always() && steps.request.outcome == 'success'
        shell: bash
        env:
          REMOTE_RC: ${{ steps.remote.outputs.rc }}
        run: |
          set -euo pipefail
          rc=${REMOTE_RC:-1}
          [[ "$rc" == 0 ]]
