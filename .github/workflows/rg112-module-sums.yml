name: RG-112 Module Sums

on:
  pull_request:
    paths:
      - backend/go.mod
      - backend/go.sum
      - .github/workflows/rg112-module-sums.yml

permissions:
  contents: read

jobs:
  module-sums:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-go@v6
        with:
          go-version: "1.26"
          cache-dependency-path: backend/go.sum
      - name: Resolve module sums
        run: |
          set -euo pipefail
          go mod tidy
          git diff -- go.mod go.sum
