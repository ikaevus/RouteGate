name: Remote VPN Node bootstrap E2E

on:
  pull_request:
    paths:
      - 'agent/**'
      - 'backend/**'
      - 'deploy/systemd/routegate-agent.service'
      - 'install-agent.sh'
      - 'scripts/build-release-bundle.sh'
      - 'scripts/remote-node-bootstrap-e2e.sh'
      - 'scripts/remote-node-bootstrap-e2e-proxy.py'
      - '.github/workflows/remote-node-bootstrap-e2e.yml'
  push:
    branches: [main]
    paths:
      - 'agent/**'
      - 'backend/**'
      - 'deploy/systemd/routegate-agent.service'
      - 'install-agent.sh'
      - 'scripts/build-release-bundle.sh'
      - 'scripts/remote-node-bootstrap-e2e.sh'
      - 'scripts/remote-node-bootstrap-e2e-proxy.py'
      - '.github/workflows/remote-node-bootstrap-e2e.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  bootstrap:
    name: Manager command to Agent heartbeat
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: routegate_remote_bootstrap_e2e
          POSTGRES_USER: routegate
          POSTGRES_PASSWORD: routegate_e2e_password
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U routegate -d routegate_remote_bootstrap_e2e"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      ROUTEGATE_E2E_DATABASE_URL: postgres://routegate:routegate_e2e_password@127.0.0.1:5432/routegate_remote_bootstrap_e2e?sslmode=disable
      ROUTEGATE_E2E_PUBLIC_URL: https://localhost:18443
      ROUTEGATE_E2E_MANAGER_ADDR: 127.0.0.1:18080
      ROUTEGATE_E2E_WORK_DIR: ${{ runner.temp }}/routegate-remote-bootstrap-e2e
      ROUTEGATE_E2E_COMMIT: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
    steps:
      - name: Checkout exact commit under test
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          ref: ${{ env.ROUTEGATE_E2E_COMMIT }}
          fetch-depth: 1

      - name: Set up Go
        uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6.5.0
        with:
          go-version: '1.26'
          cache-dependency-path: |
            backend/go.sum
            agent/go.sum

      - name: Set up Node
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Exercise real generated bootstrap
        run: |
          chmod +x scripts/remote-node-bootstrap-e2e.sh
          scripts/remote-node-bootstrap-e2e.sh

      - name: Collect sanitized diagnostics
        if: always()
        run: |
          mkdir -p "${{ runner.temp }}/routegate-bootstrap-diagnostics"
          for file in manager.log proxy.log; do
            if [[ -f "${ROUTEGATE_E2E_WORK_DIR}/${file}" ]]; then
              cp "${ROUTEGATE_E2E_WORK_DIR}/${file}" "${{ runner.temp }}/routegate-bootstrap-diagnostics/${file}"
            fi
          done
          if sudo test -f /var/log/routegate-agent-installer.log; then
            sudo cp /var/log/routegate-agent-installer.log "${{ runner.temp }}/routegate-bootstrap-diagnostics/agent-installer.log"
            sudo chown "$(id -u):$(id -g)" "${{ runner.temp }}/routegate-bootstrap-diagnostics/agent-installer.log"
          fi
          if sudo test -f /var/lib/routegate-agent-installer/state.env; then
            sudo cp /var/lib/routegate-agent-installer/state.env "${{ runner.temp }}/routegate-bootstrap-diagnostics/agent-installer-state.env"
            sudo chown "$(id -u):$(id -g)" "${{ runner.temp }}/routegate-bootstrap-diagnostics/agent-installer-state.env"
          fi

      - name: Upload diagnostics
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: remote-bootstrap-e2e-diagnostics
          path: ${{ runner.temp }}/routegate-bootstrap-diagnostics
          if-no-files-found: ignore
          retention-days: 7
