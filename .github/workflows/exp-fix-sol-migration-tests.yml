name: EXP Fix Sol Migration Expectations

on:
  push:
    branches:
      - exp/rg-smart-routing-sol

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout experiment branch
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          ref: exp/rg-smart-routing-sol
          fetch-depth: 0

      - name: Align schema expectations with migration 146
        shell: bash
        run: |
          set -euo pipefail
          sed -i 's/ExpectedDatabaseSchemaVersion         = 145/ExpectedDatabaseSchemaVersion         = 146/' backend/internal/buildinfo/buildinfo.go
          sed -i 's/000145_vpn_account_presence/000146_managed_routing_rule_sets/g' backend/internal/db/migrator_integration_test.go
          sed -i 's/000145_vpn_account_presence/000146_managed_routing_rule_sets/g' backend/internal/db/client_profile_uniqueness_drift_integration_test.go
          rm -f .github/workflows/exp-fix-sol-migration-tests.yml

      - name: Commit and push fix
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'RouteGate CI'
          git config user.email 'actions@users.noreply.github.com'
          git add backend/internal/buildinfo/buildinfo.go \
                  backend/internal/db/migrator_integration_test.go \
                  backend/internal/db/client_profile_uniqueness_drift_integration_test.go \
                  .github/workflows/exp-fix-sol-migration-tests.yml
          git commit -m 'test: align schema expectations for managed routing migration'
          git push origin HEAD:exp/rg-smart-routing-sol
