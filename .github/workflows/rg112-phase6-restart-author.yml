name: RG-112 Phase 6 Restart Author

on:
  push:
    branches:
      - rg-112-delivery-hardening-e2e
    paths:
      - .github/workflows/rg112-phase6-restart-author.yml

permissions:
  contents: write

jobs:
  author:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
        with:
          ref: rg-112-delivery-hardening-e2e
          fetch-depth: 0
      - uses: actions/setup-go@v6
        with:
          go-version: '1.26.x'
          cache: false
      - name: Correct restart fixture psql continuation and validate
        run: |
          set -euo pipefail
          python3 <<'PY'
          from pathlib import Path

          path = Path('.github/workflows/production-like-deploy.yml')
          lines = path.read_text().splitlines(keepends=True)
          matches = 0
          for index, line in enumerate(lines[:-1]):
              if 'psql "$DB_URL" -v ON_ERROR_STOP=1 -qAtc' not in line:
                  continue
              if 'DELETE FROM deliveries WHERE id=' not in lines[index + 1]:
                  continue
              body = line.rstrip('\n')
              if not body.endswith('\\\\'):
                  continue
              lines[index] = body[:-2] + '\\' + '\n'
              matches += 1
          if matches != 1:
              raise SystemExit(f'expected one bad restart cleanup continuation, found {matches}')
          text = ''.join(lines)
          path.write_text(text)
          Path('scripts/rg112-production-like-deploy.restart-fixed.yml').write_text(text)
          PY
          go install github.com/rhysd/actionlint/cmd/actionlint@latest
          "$(go env GOPATH)/bin/actionlint" .github/workflows/production-like-deploy.yml
          git diff --check
      - name: Publish validated workflow as ordinary blob
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add scripts/rg112-production-like-deploy.restart-fixed.yml
          git commit -m "RG-112 Phase 6: stage restart E2E shell fix"
          git push origin HEAD:rg-112-delivery-hardening-e2e
