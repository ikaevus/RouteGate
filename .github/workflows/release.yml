name: RouteGate Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      version:
        description: Version label used in generated bundle names
        required: true
        default: dev

permissions:
  contents: write
  id-token: write
  attestations: write
  artifact-metadata: write

jobs:
  bundles:
    name: Build native release bundles
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          fetch-depth: 0

      - name: Setup Go
        uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6.5.0
        with:
          go-version: "1.26"
          cache-dependency-path: |
            backend/go.sum
            agent/go.sum

      - name: Setup Node.js
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Resolve bundle version
        id: version
        env:
          EVENT_NAME: ${{ github.event_name }}
          TAG_NAME: ${{ github.ref_name }}
          MANUAL_VERSION: ${{ inputs.version }}
        run: |
          if [[ "$EVENT_NAME" == "push" ]]; then
            version="$TAG_NAME"
          else
            version="$MANUAL_VERSION"
          fi
          echo "version=$version" >>"$GITHUB_OUTPUT"

      - name: Build bundles
        env:
          VERSION: ${{ steps.version.outputs.version }}
          COMMIT: ${{ github.sha }}
        run: scripts/build-release-bundle.sh

      - name: Verify release manifest, checksums and bundle structure
        run: |
          python3 scripts/release_manifest.py verify \
            --manifest dist/release-manifest.json \
            --artifacts-dir dist
          cd dist
          sha256sum -c SHA256SUMS
          for bundle in routegate-*.tar.gz; do
            listing="${bundle}.files"
            tar -tzf "$bundle" > "$listing"
            grep -Fxq './bin/routegate-manager' "$listing"
            grep -Fxq './bin/routegate-agent' "$listing"
            grep -Fxq './frontend/index.html' "$listing"
            grep -Fq './manager/migrations/' "$listing"
            grep -Fxq './metadata/manifest.env' "$listing"
          done
          test -s release-manifest.json

      - name: Attest release manifest provenance
        id: attest_manifest
        uses: actions/attest@a1948c3f048ba23858d222213b7c278aabede763 # v4.1.1
        with:
          subject-path: dist/release-manifest.json

      - name: Attest release bundle provenance
        id: attest_bundles
        uses: actions/attest@a1948c3f048ba23858d222213b7c278aabede763 # v4.1.1
        with:
          subject-path: dist/routegate-*.tar.gz

      - name: Preserve offline attestation bundles
        env:
          MANIFEST_ATTESTATION: ${{ steps.attest_manifest.outputs.bundle-path }}
          BUNDLE_ATTESTATION: ${{ steps.attest_bundles.outputs.bundle-path }}
        run: |
          test -s "$MANIFEST_ATTESTATION"
          test -s "$BUNDLE_ATTESTATION"
          cp "$MANIFEST_ATTESTATION" dist/release-manifest.attestation.json
          cp "$BUNDLE_ATTESTATION" dist/release-bundles.attestation.json

      - name: Verify release provenance policy
        env:
          GH_TOKEN: ${{ github.token }}
          SIGNER_WORKFLOW: ${{ github.repository }}/.github/workflows/release.yml
        run: |
          gh attestation verify dist/release-manifest.json \
            --repo "$GITHUB_REPOSITORY" \
            --signer-workflow "$SIGNER_WORKFLOW" \
            --bundle dist/release-manifest.attestation.json

          for bundle in dist/routegate-*.tar.gz; do
            gh attestation verify "$bundle" \
              --repo "$GITHUB_REPOSITORY" \
              --signer-workflow "$SIGNER_WORKFLOW" \
              --bundle dist/release-bundles.attestation.json
          done

      - name: Upload workflow artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: routegate-${{ steps.version.outputs.version }}-bundles
          path: |
            dist/routegate-*.tar.gz
            dist/SHA256SUMS
            dist/release-manifest.json
            dist/release-manifest.attestation.json
            dist/release-bundles.attestation.json
          if-no-files-found: error

      - name: Publish GitHub release assets
        if: github.event_name == 'push'
        env:
          GH_TOKEN: ${{ github.token }}
          TAG_NAME: ${{ github.ref_name }}
        run: |
          if gh release view "$TAG_NAME" >/dev/null 2>&1; then
            gh release upload "$TAG_NAME" \
              dist/routegate-*.tar.gz \
              dist/SHA256SUMS \
              dist/release-manifest.json \
              dist/release-manifest.attestation.json \
              dist/release-bundles.attestation.json \
              --clobber
          else
            notes_file="docs/release/${TAG_NAME}.md"
            if [[ -f "$notes_file" ]]; then
              gh release create "$TAG_NAME" \
                dist/routegate-*.tar.gz \
                dist/SHA256SUMS \
                dist/release-manifest.json \
                dist/release-manifest.attestation.json \
                dist/release-bundles.attestation.json \
                --verify-tag \
                --notes-file "$notes_file" \
                --title "RouteGate $TAG_NAME"
            else
              gh release create "$TAG_NAME" \
                dist/routegate-*.tar.gz \
                dist/SHA256SUMS \
                dist/release-manifest.json \
                dist/release-manifest.attestation.json \
                dist/release-bundles.attestation.json \
                --verify-tag \
                --generate-notes \
                --title "RouteGate $TAG_NAME"
            fi
          fi
