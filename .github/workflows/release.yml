name: RouteGate Release

on:
  push:
    tags:
      - "v*"
    branches:
      - "rg-102-final-clean-vps-validation"
  workflow_dispatch:
    inputs:
      version:
        description: Version label used in generated bundle names
        required: true
        default: dev

permissions:
  contents: write

jobs:
  bundles:
    name: Build native release bundles
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Setup Go
        uses: actions/setup-go@v6
        with:
          go-version: "1.26"
          cache-dependency-path: |
            backend/go.sum
            agent/go.sum

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Resolve bundle version
        id: version
        env:
          EVENT_NAME: ${{ github.event_name }}
          REF_TYPE: ${{ github.ref_type }}
          REF_NAME: ${{ github.ref_name }}
          MANUAL_VERSION: ${{ inputs.version }}
        run: |
          if [[ "$EVENT_NAME" == "push" && "$REF_TYPE" == "branch" && "$REF_NAME" == "rg-102-final-clean-vps-validation" ]]; then
            version="rg102-validation-582b5f4"
          elif [[ "$EVENT_NAME" == "push" ]]; then
            version="$REF_NAME"
          else
            version="$MANUAL_VERSION"
          fi
          echo "version=$version" >>"$GITHUB_OUTPUT"

      - name: Build bundles
        env:
          VERSION: ${{ steps.version.outputs.version }}
          COMMIT: ${{ github.sha }}
        run: scripts/build-release-bundle.sh

      - name: Verify checksums and bundle structure
        run: |
          cd dist
          sha256sum -c SHA256SUMS
          for bundle in routegate-*.tar.gz; do
            listing="${bundle}.files"
            tar -tzf "$bundle" > "$listing"
            grep -Fxq './bin/routegate-manager' "$listing"
            grep -Fxq './bin/routegate-agent' "$listing"
            grep -Fxq './frontend/index.html' "$listing"
            grep -Fq './manager/migrations/' "$listing"
            grep -Fxq './metadata/manifest.env' "$listing"
          done

      - name: Upload workflow artifact
        uses: actions/upload-artifact@v7
        with:
          name: routegate-${{ steps.version.outputs.version }}-bundles
          path: |
            dist/routegate-*.tar.gz
            dist/SHA256SUMS
          if-no-files-found: error

      - name: Publish GitHub release assets
        if: github.event_name == 'push'
        env:
          GH_TOKEN: ${{ github.token }}
          REF_TYPE: ${{ github.ref_type }}
          REF_NAME: ${{ github.ref_name }}
          VERSION: ${{ steps.version.outputs.version }}
          TARGET_SHA: ${{ github.sha }}
        run: |
          if [[ "$REF_TYPE" == "branch" && "$REF_NAME" == "rg-102-final-clean-vps-validation" ]]; then
            release_tag="$VERSION"
            if gh release view "$release_tag" >/dev/null 2>&1; then
              gh release upload "$release_tag" dist/routegate-*.tar.gz dist/SHA256SUMS --clobber
            else
              gh release create "$release_tag" \
                dist/routegate-*.tar.gz \
                dist/SHA256SUMS \
                --target "$TARGET_SHA" \
                --prerelease \
                --generate-notes \
                --title "RouteGate RG-102 Guided Setup validation"
            fi
          else
            release_tag="$REF_NAME"
            if gh release view "$release_tag" >/dev/null 2>&1; then
              gh release upload "$release_tag" dist/routegate-*.tar.gz dist/SHA256SUMS --clobber
            else
              gh release create "$release_tag" \
                dist/routegate-*.tar.gz \
                dist/SHA256SUMS \
                --verify-tag \
                --generate-notes \
                --title "RouteGate $release_tag"
            fi
          fi
