name: RG-112 Workflow Lint

on:
  push:
    branches:
      - rg-112-delivery-hardening-e2e
    paths:
      - .github/workflows/rg112-workflow-lint.yml

permissions:
  contents: write

jobs:
  actionlint:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
        with:
          ref: rg-112-delivery-hardening-e2e
          fetch-depth: 0
      - uses: actions/setup-go@v6
        with:
          go-version: '1.26.x'
      - name: Correct and validate production-like workflow
        run: |
          set -euo pipefail
          python3 <<'PY'
          from pathlib import Path
          path = Path('.github/workflows/production-like-deploy.yml')
          text = path.read_text()
          old = '''            printf '\nROUTEGATE_PUBLIC_URL="https://us.routegate.org"\n' >> /etc/routegate/manager.env'''
          new = '''            printf '%s\\n' 'ROUTEGATE_PUBLIC_URL="https://us.routegate.org"' >> /etc/routegate/manager.env'''
          if text.count(old) != 1:
              raise SystemExit(f'expected one public URL printf target, found {text.count(old)}')
          path.write_text(text.replace(old, new, 1))
          Path('scripts/rg112-production-like-deploy.corrected.yml').write_text(path.read_text())
          PY
          go install github.com/rhysd/actionlint/cmd/actionlint@latest
          "$(go env GOPATH)/bin/actionlint" .github/workflows/production-like-deploy.yml
          git diff --check
      - name: Publish corrected workflow blob as ordinary file
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add scripts/rg112-production-like-deploy.corrected.yml
          git commit -m "RG-112 Phase 6: stage corrected production E2E workflow"
          git push origin HEAD:rg-112-delivery-hardening-e2e
