name: RG-112 Phase 6 Stage Author

on:
  push:
    branches:
      - rg-112-delivery-hardening-e2e
    paths:
      - .github/workflows/rg112-phase6-stage-author.yml

permissions:
  contents: write

jobs:
  author:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
        with:
          ref: rg-112-delivery-hardening-e2e
          fetch-depth: 0
      - uses: actions/setup-go@v6
        with:
          go-version: '1.26.x'
          cache: false
      - name: Add safe stage diagnostics and validate workflow
        run: |
          set -euo pipefail
          python3 <<'PY'
          from pathlib import Path

          path = Path('.github/workflows/production-like-deploy.yml')
          text = path.read_text()

          def replace_once(old: str, new: str) -> None:
              global text
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f'expected exactly one target, found {count}: {old[:80]!r}')
              text = text.replace(old, new, 1)

          replace_once(
              '          DB_MAY_BE_MUTATED=0\n',
              '          DB_MAY_BE_MUTATED=0\n          STAGE="initializing"\n',
          )
          replace_once(
              '              echo "RouteGate E2E failed after deployment started; restoring production-like baseline."\n',
              '              echo "RouteGate E2E failed at stage=${STAGE:-unknown}; restoring production-like baseline."\n',
          )
          replace_once(
              '          actual_bundle_sha="$(sha256sum "$BUNDLE_FILE" | awk \'{print $1}\')"\n',
              '          STAGE="preflight"\n          actual_bundle_sha="$(sha256sum "$BUNDLE_FILE" | awk \'{print $1}\')"\n',
          )
          replace_once(
              '          BACKUP_DIR="/root/routegate-backups/rg112-${EXPECTED_COMMIT}-$(date -u +%Y%m%dT%H%M%SZ)"\n',
              '          STAGE="backup"\n          BACKUP_DIR="/root/routegate-backups/rg112-${EXPECTED_COMMIT}-$(date -u +%Y%m%dT%H%M%SZ)"\n',
          )
          replace_once(
              '          systemctl stop routegate-agent\n          systemctl stop routegate-manager\n',
              '          STAGE="deploy_files"\n          systemctl stop routegate-agent\n          systemctl stop routegate-manager\n',
          )
          replace_once(
              '          DB_MAY_BE_MUTATED=1\n          systemctl start routegate-manager\n',
              '          STAGE="manager_start"\n          DB_MAY_BE_MUTATED=1\n          systemctl start routegate-manager\n',
          )
          replace_once(
              '          for migration in \\\n',
              '          STAGE="migration_validation"\n          for migration in \\\n',
          )
          replace_once(
              '          systemctl start routegate-agent\n\n          metrics_row=""\n',
              '          STAGE="agent_start"\n          systemctl start routegate-agent\n\n          STAGE="agent_runtime"\n          metrics_row=""\n',
          )
          replace_once(
              '          ADMIN_ID="$(psql "$DB_URL" -qAtc "\n',
              '          STAGE="auth_session"\n          ADMIN_ID="$(psql "$DB_URL" -qAtc "\n',
          )
          replace_once(
              '          API="http://127.0.0.1:8080"\n          FORBIDDEN_DELIVERY_COLUMNS=',
              '          API="http://127.0.0.1:8080"\n          STAGE="delivery_security"\n          FORBIDDEN_DELIVERY_COLUMNS=',
          )
          replace_once(
              '          DELIVERY_FIXTURE_ID="$(psql "$DB_URL" -qAtc "\n',
              '          STAGE="delivery_restart_recovery"\n          DELIVERY_FIXTURE_ID="$(psql "$DB_URL" -qAtc "\n',
          )
          replace_once(
              '          curl -fsS -H "Authorization: Bearer $TOKEN" "$API/api/v1/system/version" > "$WORK_DIR/version.json"\n',
              '          STAGE="dashboard_validation"\n          curl -fsS -H "Authorization: Bearer $TOKEN" "$API/api/v1/system/version" > "$WORK_DIR/version.json"\n',
          )
          replace_once(
              '          curl -fsS \\\n            -X POST \\\n            -H "Authorization: Bearer $TOKEN" \\\n            "$API/api/v1/servers/$SERVER_ID/config/versions/$VERSION_ID/reapply"',
              '          STAGE="config_reapply"\n          curl -fsS \\\n            -X POST \\\n            -H "Authorization: Bearer $TOKEN" \\\n            "$API/api/v1/servers/$SERVER_ID/config/versions/$VERSION_ID/reapply"',
          )
          replace_once(
              '          systemctl is-active --quiet routegate-manager\n',
              '          STAGE="final_health"\n          systemctl is-active --quiet routegate-manager\n',
          )
          replace_once(
              '          echo "RG-112 production-like E2E PASSED"\n',
              '          STAGE="complete"\n          echo "RG-112 production-like E2E PASSED"\n',
          )

          path.write_text(text)
          Path('scripts/rg112-production-like-deploy.staged.yml').write_text(text)
          PY
          go install github.com/rhysd/actionlint/cmd/actionlint@latest
          "$(go env GOPATH)/bin/actionlint" .github/workflows/production-like-deploy.yml
          git diff --check
      - name: Publish validated staged workflow as ordinary file
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add scripts/rg112-production-like-deploy.staged.yml
          git commit -m "RG-112 Phase 6: stage production E2E diagnostics"
          git push origin HEAD:rg-112-delivery-hardening-e2e
