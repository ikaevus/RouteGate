name: RG-109 SQL smoke

on:
  push:
    branches:
      - agent/rg-109-config-lifecycle-retention

jobs:
  smoke:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
        with:
          ref: agent/rg-109-config-lifecycle-retention

      - name: Start PostgreSQL
        shell: bash
        run: |
          sudo systemctl start postgresql
          sudo -u postgres createdb routegate_rg109

      - name: Apply all migrations
        shell: bash
        run: |
          for migration in $(find backend/migrations -maxdepth 1 -name '*.up.sql' | sort); do
            echo "Applying $migration"
            sudo -u postgres psql -v ON_ERROR_STOP=1 -d routegate_rg109 -f "$migration" >/dev/null
          done

      - name: Verify bounded lifecycle
        shell: bash
        run: |
          sudo -u postgres psql -v ON_ERROR_STOP=1 -d routegate_rg109 <<'SQL'
          DO $$
          DECLARE
            sid UUID;
            vid UUID;
            first_vid UUID;
            i INTEGER;
            kept INTEGER;
            terminal_jobs INTEGER;
          BEGIN
            INSERT INTO servers(name, status)
            VALUES ('rg109-smoke', 'active')
            RETURNING id INTO sid;

            FOR i IN 1..8 LOOP
              INSERT INTO config_versions(server_id, version, config_hash, status, rendered_config, pinned)
              VALUES (sid, i, 'hash-' || i, 'validated', '{}'::jsonb, i = 1)
              RETURNING id INTO vid;

              IF i = 1 THEN
                first_vid := vid;
              END IF;

              UPDATE servers SET next_config_version = i + 1 WHERE id = sid;

              INSERT INTO config_apply_jobs(server_id, config_version_id, action, status)
              VALUES (sid, vid, 'apply', 'in_progress');

              UPDATE config_apply_jobs
              SET status = 'succeeded', completed_at = now(), updated_at = now()
              WHERE server_id = sid
                AND config_version_id = vid
                AND status = 'in_progress';
            END LOOP;

            IF (SELECT active_config_version_id FROM servers WHERE id = sid) IS DISTINCT FROM vid THEN
              RAISE EXCEPTION 'current config pointer was not updated';
            END IF;

            IF NOT EXISTS (SELECT 1 FROM config_versions WHERE id = first_vid AND pinned = TRUE) THEN
              RAISE EXCEPTION 'pinned historical config was pruned';
            END IF;

            SELECT COUNT(*) INTO kept FROM config_versions WHERE server_id = sid;
            IF kept <> 7 THEN
              RAISE EXCEPTION 'expected current + five historical + one pinned, got %', kept;
            END IF;

            IF (SELECT next_config_version FROM servers WHERE id = sid) <> 9 THEN
              RAISE EXCEPTION 'next config version is not monotonic';
            END IF;

            FOR i IN 1..105 LOOP
              INSERT INTO config_apply_jobs(server_id, config_version_id, action, status)
              VALUES (sid, vid, 'apply', 'in_progress');

              UPDATE config_apply_jobs
              SET status = 'failed', completed_at = now(), updated_at = now()
              WHERE id = (
                SELECT id
                FROM config_apply_jobs
                WHERE server_id = sid
                  AND config_version_id = vid
                  AND status = 'in_progress'
                ORDER BY created_at DESC, id DESC
                LIMIT 1
              );
            END LOOP;

            SELECT COUNT(*) INTO terminal_jobs
            FROM config_apply_jobs
            WHERE server_id = sid
              AND status IN ('succeeded', 'failed');

            IF terminal_jobs <> 100 THEN
              RAISE EXCEPTION 'expected exactly 100 terminal jobs, got %', terminal_jobs;
            END IF;
          END $$;
          SQL
