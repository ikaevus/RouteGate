name: RG-108 one-shot patch

on:
  push:
    branches:
      - agent/rg-108-config-deploy-history-control

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          ref: agent/rg-108-config-deploy-history-control
          fetch-depth: 0

      - name: Setup Go
        uses: actions/setup-go@v6
        with:
          go-version: "1.26"

      - name: Apply RG-108 source changes
        run: |
          python3 .github/rg108_patch.py
          gofmt -w \
            backend/internal/configs/lifecycle.go \
            backend/internal/configs/lifecycle_handler.go \
            backend/internal/configs/lifecycle_repository.go \
            backend/internal/configs/lifecycle_test.go \
            backend/internal/auth/repository.go \
            backend/internal/http/router.go

      - name: Commit patched source and remove one-shot files
        run: |
          rm .github/workflows/rg108-patch.yml .github/rg108_patch.py
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --check
          git commit -m "RG-108 config deploy history control"
          git push origin HEAD:agent/rg-108-config-deploy-history-control
