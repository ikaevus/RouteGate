name: RouteGate CI

on:
  push:
    branches:
      - main
  pull_request:

jobs:
  backend:
    name: Backend tests
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: routegate_ci
          POSTGRES_USER: routegate
          POSTGRES_PASSWORD: routegate_ci_password
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U routegate -d routegate_ci"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      ROUTEGATE_TEST_DATABASE_URL: postgres://routegate:routegate_ci_password@127.0.0.1:5432/routegate_ci?sslmode=disable

    defaults:
      run:
        working-directory: backend

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Go
        uses: actions/setup-go@v6
        with:
          go-version: "1.26"
          cache-dependency-path: backend/go.sum

      - name: Download dependencies
        run: go mod download

      - name: Run tests
        run: go test ./...

  agent:
    name: Agent tests
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: agent

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Go
        uses: actions/setup-go@v6
        with:
          go-version: "1.26"
          cache-dependency-path: agent/go.sum

      - name: Download dependencies
        run: go mod download

      - name: Run tests
        run: go test ./...

  installer:
    name: Clean VPS installer checks
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Setup Go
        uses: actions/setup-go@v6
        with:
          go-version: "1.26"
          cache-dependency-path: |
            backend/go.sum
            agent/go.sum

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install ShellCheck
        run: |
          sudo apt-get update
          sudo apt-get install -y shellcheck

      - name: Validate shell syntax
        run: bash -n install.sh scripts/build-release-bundle.sh scripts/test-clean-vps-installer.sh

      - name: Run ShellCheck
        run: shellcheck -x install.sh scripts/build-release-bundle.sh scripts/test-clean-vps-installer.sh

      - name: Run installer unit tests
        run: scripts/test-clean-vps-installer.sh

      - name: Build and verify amd64 release bundle
        env:
          VERSION: ci-test
          COMMIT: ${{ github.sha }}
          ARCHITECTURES: amd64
          OUTPUT_DIR: ${{ runner.temp }}/routegate-dist
        run: |
          scripts/build-release-bundle.sh
          cd "$OUTPUT_DIR"
          sha256sum -c SHA256SUMS
          tar -tzf routegate-ci-test-linux-amd64.tar.gz > bundle-files.txt
          grep -Fxq './bin/routegate-manager' bundle-files.txt
          grep -Fxq './bin/routegate-agent' bundle-files.txt
          grep -Fxq './frontend/index.html' bundle-files.txt
          grep -Fq './manager/migrations/' bundle-files.txt
          grep -Fxq './metadata/manifest.env' bundle-files.txt

      - name: Upload amd64 clean-host E2E bundle
        uses: actions/upload-artifact@v7
        with:
          name: routegate-${{ github.event.pull_request.head.sha || github.sha }}-linux-amd64
          path: |
            ${{ runner.temp }}/routegate-dist/routegate-ci-test-linux-amd64.tar.gz
            ${{ runner.temp }}/routegate-dist/SHA256SUMS
          if-no-files-found: error
          retention-days: 7

  frontend:
    name: Frontend build
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: frontend

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Check localization
        run: npm run i18n:check

      - name: Build frontend
        run: npm run build

  website:
    name: Website build
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: website

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: website/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Build website
        run: npm run build
