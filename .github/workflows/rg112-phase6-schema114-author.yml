name: RG-112 Phase 6 Schema 114 Author

on:
  push:
    branches:
      - rg-112-delivery-hardening-e2e
    paths:
      - .github/workflows/rg112-phase6-schema114-author.yml

permissions:
  contents: write

jobs:
  author:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
        with:
          ref: rg-112-delivery-hardening-e2e
          fetch-depth: 0
      - uses: actions/setup-go@v6
        with:
          go-version: '1.26.x'
          cache: false
      - name: Advance production E2E to schema 114 and validate
        run: |
          set -euo pipefail
          python3 <<'PY'
          from pathlib import Path
          path = Path('.github/workflows/production-like-deploy.yml')
          text = path.read_text()

          replacements = [
              (
                  '            000113_delivery_foundation; do',
                  '            000113_delivery_foundation \\\n            000114_agent_runtime_metrics_backfill; do',
              ),
              (
                  "          assert version['database']['expectedSchemaVersion'] == 113, version['database']",
                  "          assert version['database']['expectedSchemaVersion'] == 114, version['database']",
              ),
              (
                  "          assert version['database']['appliedSchemaVersion'] == '000113_delivery_foundation', version['database']",
                  "          assert version['database']['appliedSchemaVersion'] == '000114_agent_runtime_metrics_backfill', version['database']",
              ),
          ]
          for old, new in replacements:
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f'expected one target, found {count}: {old!r}')
              text = text.replace(old, new, 1)

          path.write_text(text)
          Path('scripts/rg112-production-like-deploy.schema114.yml').write_text(text)
          PY
          go install github.com/rhysd/actionlint/cmd/actionlint@latest
          "$(go env GOPATH)/bin/actionlint" .github/workflows/production-like-deploy.yml
          git diff --check
      - name: Publish validated workflow as ordinary blob
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add scripts/rg112-production-like-deploy.schema114.yml
          git commit -m "RG-112 Phase 6: stage schema 114 production E2E"
          git push origin HEAD:rg-112-delivery-hardening-e2e
