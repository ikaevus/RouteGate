name: Workspace integration

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  workspace:
    name: Browser with Manager and PostgreSQL (${{ matrix.database_role }})
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        database_role: [legacy, runtime, restored]
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: routegate_workspace_e2e
          POSTGRES_USER: routegate
          POSTGRES_PASSWORD: routegate_ci_password
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U routegate -d routegate_workspace_e2e"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      ROUTEGATE_DATABASE_URL: postgres://routegate:routegate_ci_password@127.0.0.1:5432/routegate_workspace_e2e?sslmode=disable
      ROUTEGATE_E2E_ISOLATED: '1'
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6.5.0
        with:
          go-version: '1.26'
          cache-dependency-path: backend/go.sum
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Build Manager
        working-directory: backend
        run: go build -o "$RUNNER_TEMP/routegate-manager" ./cmd/routegate-manager
      - name: Prepare isolated runtime login after external migrations
        if: matrix.database_role != 'legacy'
        working-directory: backend
        env:
          RG140_POSTGRES_CONTAINER: ${{ job.services.postgres.id }}
        run: |
          timeout 60s "$RUNNER_TEMP/routegate-manager" --migrate-only
          timeout 60s "$RUNNER_TEMP/routegate-manager" --create-runtime-role rg140_workspace_runtime
          psql "$ROUTEGATE_DATABASE_URL" -X -v ON_ERROR_STOP=1 -c "ALTER ROLE rg140_workspace_runtime LOGIN PASSWORD 'runtime_ci_only_password'"
          if [[ '${{ matrix.database_role }}' == 'restored' ]]; then
            bash ../scripts/test-runtime-database-restore.sh
          fi
          printf '%s\n' 'ROUTEGATE_DATABASE_URL=postgres://rg140_workspace_runtime:runtime_ci_only_password@127.0.0.1:5432/routegate_workspace_e2e?sslmode=disable' >> "$GITHUB_ENV"
          printf '%s\n' 'ROUTEGATE_DATABASE_MIGRATION_MODE=external' 'ROUTEGATE_E2E_RUNTIME_ROLE=1' >> "$GITHUB_ENV"
      - name: Install browser dependencies
        working-directory: frontend
        run: |
          npm ci
          npx playwright install --with-deps chromium
      - name: Exercise workspace against Manager
        working-directory: frontend
        run: ROUTEGATE_E2E_MANAGER="$RUNNER_TEMP/routegate-manager" npm run test:workspace-integration
      - name: Verify runtime privilege boundary after full Manager execution
        if: matrix.database_role != 'legacy'
        run: psql "$ROUTEGATE_DATABASE_URL" -X -v ON_ERROR_STOP=1 -f scripts/rg140-runtime-workspace-check.sql
      - name: Verify restored role identity and authentication after browser execution
        if: matrix.database_role == 'restored'
        env:
          ROUTEGATE_DATABASE_URL: postgres://routegate:routegate_ci_password@127.0.0.1:5432/routegate_workspace_e2e?sslmode=disable
          RG140_POSTGRES_CONTAINER: ${{ job.services.postgres.id }}
        run: bash scripts/test-runtime-database-restore.sh --verify-identity
