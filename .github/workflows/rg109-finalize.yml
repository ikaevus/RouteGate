name: RG-109 finalize

on:
  push:
    branches:
      - agent/rg-109-config-lifecycle-retention

permissions:
  contents: write

jobs:
  finalize:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          ref: agent/rg-109-config-lifecycle-retention
          fetch-depth: 0

      - name: Setup Go
        uses: actions/setup-go@v6
        with:
          go-version: "1.26"
          cache-dependency-path: backend/go.sum

      - name: Keep all active jobs visible
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('backend/internal/configs/repository.go')
          text = p.read_text()
          old = "\t\tWHERE server_id = $1::uuid\n\t\tORDER BY created_at DESC\n\t\tLIMIT 100\n\t`, serverID)"
          new = "\t\tWHERE server_id = $1::uuid\n\t\tORDER BY created_at DESC\n\t`, serverID)"
          if old not in text:
              raise SystemExit('bounded API query block not found')
          p.write_text(text.replace(old, new, 1))
          PY

      - name: Backend tests
        working-directory: backend
        run: go test ./...

      - name: Commit and self-remove
        shell: bash
        run: |
          git rm -f .github/workflows/rg109-finalize.yml
          git add backend/internal/configs/repository.go
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "RG-109 keep active deployment jobs visible"
          git push origin HEAD:agent/rg-109-config-lifecycle-retention
