name: RG-114 Schema Test Self-Patch

on:
  push:
    branches:
      - rg-114-distinct-tcp-listener-ports

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout branch
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          ref: rg-114-distinct-tcp-listener-ports
          fetch-depth: 1

      - name: Update current schema expectations and remove patcher
        shell: bash
        run: |
          set -euo pipefail
          files=(
            backend/internal/db/migrator_integration_test.go
            backend/internal/db/client_profile_uniqueness_drift_integration_test.go
          )
          for file in "${files[@]}"; do
            sed -i 's/000133_multi_protocol_account_access/000134_distinct_tcp_listener_ports/g' "$file"
          done
          rm -f .github/workflows/rg-114-schema-test-selfpatch.yml

          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add "${files[@]}" .github/workflows/rg-114-schema-test-selfpatch.yml
          git diff --cached --quiet && exit 0
          git commit -m 'RG-114: update migration integration expectations'
          git push origin HEAD:rg-114-distinct-tcp-listener-ports
