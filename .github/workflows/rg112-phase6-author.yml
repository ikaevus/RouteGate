name: RG-112 Phase 6 Author Patch

on:
  push:
    branches:
      - rg-112-delivery-hardening-e2e
    paths:
      - .github/workflows/rg112-phase6-author.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
        with:
          ref: rg-112-delivery-hardening-e2e
          fetch-depth: 0
      - name: Apply bounded RG-112 Phase 6 patch
        run: |
          set -euo pipefail
          python3 scripts/rg112-phase6-author.py
          git diff --check
          cp .github/workflows/production-like-deploy.yml scripts/rg112-production-like-deploy.patched.yml
          git diff -- install.sh scripts/test-clean-vps-installer.sh .github/workflows/production-like-deploy.yml
      - name: Commit ordinary files and patched workflow blob
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add install.sh scripts/test-clean-vps-installer.sh scripts/rg112-production-like-deploy.patched.yml
          git commit -m "RG-112 Phase 6: harden installer and stage production E2E"
          git push origin HEAD:rg-112-delivery-hardening-e2e
