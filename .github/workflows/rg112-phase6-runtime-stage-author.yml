name: RG-112 Phase 6 Runtime Stage Author

on:
  push:
    branches:
      - rg-112-delivery-hardening-e2e
    paths:
      - .github/workflows/rg112-phase6-runtime-stage-author.yml

permissions:
  contents: write

jobs:
  author:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
        with:
          ref: rg-112-delivery-hardening-e2e
          fetch-depth: 0
      - uses: actions/setup-go@v6
        with:
          go-version: '1.26.x'
          cache: false
      - name: Refine safe runtime stages and validate
        run: |
          set -euo pipefail
          python3 <<'PY'
          from pathlib import Path
          path = Path('.github/workflows/production-like-deploy.yml')
          text = path.read_text()

          if text.count('STAGE="agent_runtime"') != 1:
              raise SystemExit(f'agent runtime stage count={text.count("STAGE=\"agent_runtime\"")}')
          text = text.replace('STAGE="agent_runtime"', 'STAGE="agent_runtime_wait"', 1)

          marker = 'persisted_runtime_block="$(psql "$DB_URL" -qAtc "SELECT COUNT(*) FROM agents WHERE capabilities ? \'runtimeMetrics\'")"'
          if text.count(marker) != 1:
              raise SystemExit(f'agent runtime persistence marker count={text.count(marker)}')
          text = text.replace(
              marker,
              'STAGE="agent_runtime_persistence"\n          ' + marker + '\n          echo "persisted_runtime_capability_rows=$persisted_runtime_block"',
              1,
          )

          path.write_text(text)
          Path('scripts/rg112-production-like-deploy.runtime-staged.yml').write_text(text)
          PY
          go install github.com/rhysd/actionlint/cmd/actionlint@latest
          "$(go env GOPATH)/bin/actionlint" .github/workflows/production-like-deploy.yml
          git diff --check
      - name: Publish staged workflow as ordinary blob
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add scripts/rg112-production-like-deploy.runtime-staged.yml
          git commit -m "RG-112 Phase 6: stage refined runtime diagnostics"
          git push origin HEAD:rg-112-delivery-hardening-e2e
