name: EXP Deploy Sol UI Polish

on:
  push:
    branches:
      - exp/rg-smart-routing-sol
    paths:
      - .github/workflows/exp-deploy-sol-ui-polish.yml

permissions:
  contents: read

concurrency:
  group: routegate-production-like-deploy
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-24.04
    environment: production-like
    timeout-minutes: 20
    env:
      TARGET_SHA: 3b06f79b01a5f1579bdc7157ad71ddc54a6b4261
    steps:
      - name: Checkout validated Sol UI polish
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10
        with:
          ref: ${{ env.TARGET_SHA }}
          fetch-depth: 0
      - name: Setup Go
        uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16
        with:
          go-version: '1.26.x'
          cache-dependency-path: |
            backend/go.sum
            agent/go.sum
      - name: Setup Node.js
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Build validated release bundle
        shell: bash
        env:
          VERSION: production-like
          COMMIT: ${{ env.TARGET_SHA }}
          ARCHITECTURES: amd64
          OUTPUT_DIR: ${{ runner.temp }}/routegate-dist
        run: |
          set -euo pipefail
          ./scripts/build-release-bundle.sh
          test -s "${OUTPUT_DIR}/routegate-${VERSION}-linux-amd64.tar.gz"
      - name: Configure SSH
        shell: bash
        env:
          ROUTEGATE_SSH_KEY: ${{ secrets.ROUTEGATE_SSH_KEY }}
          ROUTEGATE_KNOWN_HOSTS: ${{ secrets.ROUTEGATE_KNOWN_HOSTS }}
        run: |
          set -euo pipefail
          install -d -m 700 ~/.ssh
          printf '%s\n' "$ROUTEGATE_SSH_KEY" > ~/.ssh/routegate_ci
          chmod 600 ~/.ssh/routegate_ci
          printf '%s\n' "$ROUTEGATE_KNOWN_HOSTS" > ~/.ssh/known_hosts
          chmod 600 ~/.ssh/known_hosts
      - name: Deploy validated Sol UI polish
        shell: bash
        env:
          ROUTEGATE_HOST: ${{ secrets.ROUTEGATE_HOST }}
          ROUTEGATE_USER: ${{ secrets.ROUTEGATE_USER }}
        run: |
          set -euo pipefail
          SSH=(ssh -i ~/.ssh/routegate_ci -o BatchMode=yes -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes -o ConnectTimeout=10)
          SCP=(scp -i ~/.ssh/routegate_ci -o BatchMode=yes -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes -o ConnectTimeout=10)
          bundle="${RUNNER_TEMP}/routegate-dist/routegate-production-like-linux-amd64.tar.gz"
          bundle_sha="$(sha256sum "$bundle" | awk '{print $1}')"
          remote_bundle="/tmp/routegate-deploy-${TARGET_SHA}.tar.gz"
          remote_deploy="/tmp/routegate-deploy-${TARGET_SHA}.sh"
          remote_validate="/tmp/routegate-deploy-validate-${TARGET_SHA}.sh"
          remote_core="/tmp/routegate-update-core-${TARGET_SHA}.sh"
          "${SCP[@]}" "$bundle" "$ROUTEGATE_USER@$ROUTEGATE_HOST:$remote_bundle"
          "${SCP[@]}" scripts/deploy-production-like-bundle.sh "$ROUTEGATE_USER@$ROUTEGATE_HOST:$remote_deploy"
          "${SCP[@]}" scripts/validate-production-like-deploy.sh "$ROUTEGATE_USER@$ROUTEGATE_HOST:$remote_validate"
          "${SCP[@]}" scripts/routegate-update-core.sh "$ROUTEGATE_USER@$ROUTEGATE_HOST:$remote_core"
          set +e
          "${SSH[@]}" "$ROUTEGATE_USER@$ROUTEGATE_HOST" "sudo flock -w 600 /run/lock/routegate-production-like.lock bash '$remote_deploy' '$TARGET_SHA' '$remote_bundle' '$bundle_sha' '$remote_validate' '$remote_core'"
          rc=$?
          set -e
          "${SSH[@]}" "$ROUTEGATE_USER@$ROUTEGATE_HOST" "rm -f '$remote_deploy' '$remote_validate' '$remote_core' '$remote_bundle'" || true
          exit "$rc"
